<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master SKU - FormulaMid</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell admin-shell admin-scroll admin-sku" data-allowed-roles="admin,contable">

    <header class="app-topbar">
        <div class="topbar-left">
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>
        <div class="topbar-right">
            <span class="area-brand">ADMIN</span>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">
                <!-- Loading State -->
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-spinner" aria-hidden="true"></div>
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando SKU...</p>
                        <p class="state-desc">Esto puede tardar unos segundos</p>
                    </div>
                </div>
                <!-- Empty State -->
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block loading">
                        <p class="state-title">Sin resultados</p>
                        <p class="state-desc">Prueba con otro término o categoría.</p>
                        <!-- Optional button to clear filters can be handled by JS contextually -->
                    </div>
                </div>

                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Gestión de SKU</h2>
                                <p class="dashboard-subtitle dashboard-subtitle-soft">Productos, precios y solicitudes
                                    de cambio</p>
                            </div>
                            <div class="actions-bar">
                                <button class="btn-icon btn-icon-flat btn-icon-plus" id="btn-new"
                                    aria-label="Nuevo SKU">+</button>
                            </div>
                        </div>

                        <!-- View Switcher -->
                        <div class="filter-bar" style="margin-bottom: 16px;">
                            <div class="tab-bar" id="sku-view-tabs">
                                <button class="tab-chip active" data-view="skus">SKU / Productos</button>
                                <button class="tab-chip" data-view="requests">Solicitudes</button>
                            </div>
                        </div>

                        <div id="view-skus" class="dashboard-view">
                            <div class="filter-bar filter-bar-compact" aria-label="Filtros de SKU">
                                <div class="filter-group" id="sku-tabs">
                                    <!-- JS will inject Category Pills here -->
                                </div>
                                <div class="filter-actions">
                                    <input type="search" id="search-input" class="input input-compact filter-input"
                                        placeholder="Buscar SKU..." aria-label="Buscar SKU">
                                </div>
                            </div>

                            <!-- List Container (Managed by JS) -->
                            <div class="staff-list table-viewport table-shell" id="list-container">
                                <!-- Content injected by JS -->
                            </div>
                        </div>

                        <div id="view-requests" class="dashboard-view hidden">
                            <div class="filter-bar filter-bar-compact">
                                <div class="filter-group">
                                    <span class="dashboard-subtitle muted" style="padding-left: 8px;">Solicitudes
                                        pendientes de aprobación</span>
                                </div>
                                <div class="filter-actions">
                                    <button class="btn-ghost btn-sm" id="btn-refresh-requests">Refrescar</button>
                                </div>
                            </div>

                            <div class="staff-list table-viewport table-shell" id="requests-list-container">
                                <!-- Content injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Slide Panel -->
    <div class="panel-overlay" id="panel-overlay"></div>
    <div class="slide-panel" id="slide-panel">
        <div class="panel-header">
            <h3 class="panel-title" id="panel-title">Nuevo SKU</h3>
            <button class="panel-close" id="btn-close-panel" aria-label="Cerrar panel">×</button>
        </div>
        <div class="panel-body" id="panel-form-container">
            <div id="panel-error" class="panel-error"></div>

            <div class="form-group">
                <label for="sku-nombre" class="form-label">Nombre *</label>
                <input type="text" id="sku-nombre" class="input" placeholder="Ej: Red Bull Lata 250ml" required>
            </div>

            <div class="form-group">
                <label for="sku-categoria" class="form-label">Categoría</label>
                <select id="sku-categoria" class="input">
                    <option value="">Seleccionar categoría</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sku-proveedor" class="form-label">Proveedor</label>
                <select id="sku-proveedor" class="input">
                    <option value="">Seleccionar proveedor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sku-pack" class="form-label">Cantidad por pack</label>
                <input type="number" id="sku-pack" class="input" placeholder="Ej: 24" min="0" step="1">
            </div>

            <div class="form-group">
                <label for="sku-ml" class="form-label">ML por unidad</label>
                <input type="number" id="sku-ml" class="input" placeholder="Ej: 330" min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="sku-costo" class="form-label">Costo unitario</label>
                <input type="number" id="sku-costo" class="input" placeholder="Ej: 1200.50" min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="sku-costo-pack" class="form-label">Costo por pack</label>
                <input type="number" id="sku-costo-pack" class="input" placeholder="Ej: 28800" min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="sku-external-id" class="form-label">ID externo</label>
                <input type="text" id="sku-external-id" class="input" placeholder="Código de integración / POS">
            </div>

            <div class="form-group">
                <label class="form-label" for="sku-active">Estado</label>
                <label class="checkbox-row">
                    <input type="checkbox" id="sku-active" checked>
                    <span>Activo</span>
                </label>
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn-secondary" id="btn-cancel">Cancelar</button>
            <button class="btn-primary" id="btn-save">Guardar</button>
        </div>
    </div>
    <!-- Scripts -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/navigation-state.js"></script>
    <script defer src="../../assets/js/core/breadcrumbs.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>

    <!-- Page Specific Script -->
    <!-- Shared Panel Logic -->
    <script defer src="../../assets/js/modules/panel.js"></script>
    <!-- Page Specific Script -->
    <script defer src="../../assets/js/modules/admin/admin-master-sku.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const breadcrumbContainer = document.getElementById("breadcrumbs");
            if (breadcrumbContainer && window.Breadcrumbs) {
                window.Breadcrumbs.render(breadcrumbContainer);
            }
        });
    </script>
</body>

</html>
