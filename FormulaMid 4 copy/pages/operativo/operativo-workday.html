<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operativo - Work Day</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell operativo-shell admin-scroll"
    data-allowed-roles="operativo,staff_barra,admin,encargado_barra,encargado_caja,encargado_limpieza,encargado_seguridad,staff_caja,staff_seguridad,staff_operativo">

    <!-- Topbar -->
    <header class="app-topbar">
        <div class="topbar-left">
            <button class="btn-icon btn-icon-flat" data-go="pages/operativo/operativo-index.html"
                aria-label="Volver">←</button>
            <span class="topbar-back">Inicio</span>
        </div>
        <nav class="topbar-center">
            <span class="topbar-brand">Work Day - Vista Operativa</span>
        </nav>
        <div class="topbar-right">
            <span class="system-status-pill status-open topbar-pill topbar-pill-quiet" id="workday-status">
                Jornada: --
            </span>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <!-- Loading State -->
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-spinner" aria-hidden="true"></div>
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando Work Day...</p>
                    </div>
                </div>

                <!-- Main Content -->
                <div id="module-content">
                    <div class="planner-dashboard">

                        <!-- PANEL A: Links Públicos de Passline -->
                        <section class="planner-section">
                            <div class="panel-title-row">
                                <span>A. Links Públicos de Passline</span>
                                <button class="btn-primary btn-sm" id="btn-new-link">+ Nuevo Link</button>
                            </div>

                            <div class="table-shell" style="margin-top: 16px;">
                                <div class="table-scroll">
                                    <table class="table table-compact">
                                        <thead>
                                            <tr>
                                                <th class="table-cell is-header">Nombre</th>
                                                <th class="table-cell is-header">Descripción</th>
                                                <th class="table-cell is-header">URL</th>
                                                <th class="table-cell is-header" style="width: 100px;">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="links-table-body">
                                            <tr>
                                                <td colspan="4" class="table-cell text-center text-white/30 p-4">
                                                    Cargando links...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        <!-- Grid 2 Columnas: Nómina y Solicitudes -->
                        <div class="planner-grid" style="margin-top: 24px;">

                            <!-- PANEL B: Estado de Nómina -->
                            <div class="planner-panel">
                                <div class="panel-title-row">
                                    <span>B. Estado de Nómina</span>
                                    <span class="badge" id="staff-summary-badge">--/--</span>
                                </div>

                                <div class="panel-scroll" id="staff-container">
                                    <div class="state-block loading">
                                        <div class="state-loader"></div>
                                        <p class="state-title">Cargando nómina...</p>
                                    </div>
                                </div>
                            </div>

                            <!-- PANEL C: Solicitudes Pendientes -->
                            <div class="planner-panel">
                                <div class="panel-title-row">
                                    <span>C. Solicitudes Pendientes</span>
                                    <button class="btn-ghost btn-xs"
                                        data-go="pages/operativo/operativo-solicitudes.html">
                                        Ver Todas →
                                    </button>
                                </div>

                                <div class="panel-scroll" id="requests-container">
                                    <div class="state-block loading">
                                        <div class="state-loader"></div>
                                        <p class="state-title">Cargando solicitudes...</p>
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal: Crear/Editar Link de Passline -->
    <div class="modal-overlay hidden" id="link-modal">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h2 class="modal-title" id="link-modal-title">Nuevo Tipo de Entrada</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nombre del Tipo</label>
                    <input type="text" id="input-link-name" class="input" placeholder="Ej: ACCESOS 2.00" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Descripción (opcional)</label>
                    <input type="text" id="input-link-description" class="input"
                        placeholder="Ej: Entrada general al evento">
                </div>
                <div class="form-group">
                    <label class="form-label">URL de Passline</label>
                    <input type="url" id="input-link-url" class="input" placeholder="https://..." required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancel-link">Cancelar</button>
                <button class="btn-primary" id="btn-save-link">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/constants.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/modules/work-day-helper.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>

    <!-- Module Logic -->
    <script defer src="../../assets/js/modules/operativo/operativo-workday.js"></script>

</body>

</html>
