<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - FormulaMid</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell admin-shell admin-scroll admin-stock" data-allowed-roles="admin,contable,logistico">

    <header class="app-topbar">
        <div class="topbar-left">
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>

        <nav class="topbar-center topbar-nav-split">
            <div class="topbar-nav-group left">
                <button class="topbar-link is-fade-1" data-go="pages/admin/admin-solicitudes.html">Solicitudes</button>
            </div>
            <div class="topbar-nav-group center">
                <button class="topbar-link is-center active" data-go="pages/admin/admin-stock.html">Stock</button>
            </div>
            <div class="topbar-nav-group right">
                <button class="topbar-link is-fade-1" data-go="pages/admin/admin-stock-ajustes.html">Ajustes</button>
            </div>
        </nav>

        <div class="topbar-right">
            <span class="system-status-pill status-open topbar-pill topbar-pill-quiet">ESTADO: OK</span>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">
                <!-- Loading State -->
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-spinner" aria-hidden="true"></div>
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando inventario...</p>
                        <p class="state-desc">Consultando stock en tiempo real</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block loading">
                        <p class="state-title">Sin resultados</p>
                        <p class="state-desc">No se encontraron items con los filtros actuales.</p>
                        <button class="btn-ghost btn-sm mt-3" onclick="window.location.reload()">Refrescar</button>
                    </div>
                </div>

                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Control de Stock</h2>
                                <p class="dashboard-subtitle dashboard-subtitle-soft">Monitor de niveles y movimientos
                                </p>
                            </div>
                            <div class="row-flex gap-sm">
                                <button class="btn-ghost btn-icon btn-sm" id="btn-refresh" title="Refrescar"
                                    aria-label="Refrescar lista">↻</button>
                                <button class="btn-icon btn-icon-flat btn-icon-plus" id="btn-ingreso"
                                    aria-label="Nuevo Ingreso">+</button>
                            </div>
                        </div>

                        <!-- Filter Bar -->
                        <div class="filter-bar filter-bar-compact" aria-label="Filtros de stock">
                            <div class="filter-group text-sm" id="stock-tabs">
                                <!-- Injected by JS: Categorias -->
                                <button
                                    class="status-pill status-neutral topbar-pill topbar-pill-quiet filter-pill active"
                                    data-id="">
                                    Todos <span class="pill-count" id="count-total">0</span>
                                </button>
                            </div>
                            <div class="filter-actions">
                                <input type="search" id="stock-search" class="input input-compact filter-input"
                                    placeholder="Buscar SKU..." aria-label="Buscar SKU" />
                            </div>
                        </div>

                        <!-- List Container -->
                        <div class="staff-list table-viewport table-shell" id="list-container">
                            <!-- Content Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Slide Panel -->
    <div class="panel-overlay" id="panel-overlay"></div>
    <aside class="slide-panel" id="slide-panel">
        <div class="panel-header">
            <h3 class="panel-title" id="panel-title">Detalle de Producto</h3>
            <button class="btn-icon panel-close" id="btn-close-panel" aria-label="Cerrar">×</button>
        </div>
        <div class="panel-body" id="panel-content">
            <!-- Dynamic Form -->
        </div>
        <div class="panel-footer">
            <button class="btn-secondary panel-close" id="btn-close-panel-footer">Cerrar</button>
            <button class="btn-primary" id="btn-save-panel">Guardar Movimiento</button>
        </div>
    </aside>

    <!-- Scripts -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/constants.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/navigation-state.js"></script>
    <script defer src="../../assets/js/core/breadcrumbs.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>

    <!-- Shared Panel Logic -->
    <script defer src="../../assets/js/core/panel.js"></script>
    <!-- Module Script -->
    <script defer src="../../assets/js/modules/admin/admin-stock.js"></script>

    <script>
        // Auto-render breadcrumbs
        const breadcrumbContainer = document.getElementById("breadcrumbs");
        if (breadcrumbContainer) {
            window.Breadcrumbs.render(breadcrumbContainer);
        }
    </script>
</body>

</html>
