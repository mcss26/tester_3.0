<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight - Iniciar Sesión</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="theme-color" content="#0a0a0f">

  <!-- Estilos -->
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/components.css" />

  <!-- Supabase & Core JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="assets/js/core/config.js"></script>
  <script defer src="assets/js/core/supabase-client.js"></script>
  <script defer src="assets/js/core/auth.js"></script>

  <!-- Login Module -->
  <script src="assets/js/modules/login.js" defer></script>
</head>

<body class="login">
  <div class="card">
    <div class="header">
      <h1>MIDNIGHT CLUB</h1>
    </div>

    <form id="login-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="usuario@formula.mid" />
      </div>

      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>

      <div id="login-error" class="error-message" role="alert" aria-live="polite"></div>

      <button type="submit" class="btn-primary">Ingresar</button>

      <div class="login-staff-divider">
        <button type="button" class="btn-ghost text-xs" id="btn-staff-toggle">
          ¿Eres Staff? Acceso aquí
        </button>
        <p id="staff-hint" class="staff-hint hidden">
          Staff: Usa tu email registrado y contraseña genérica (o solicita acceso al Encargado).</p>
      </div>
    </form>

  </div>
</body>

</html>
