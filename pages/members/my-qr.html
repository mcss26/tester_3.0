<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <title>Mi QR — Midnight</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/members.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>

<body class="member-panel">

  <main class="member-qr-container">
    <div id="qr-loading" class="state-block loading">
      <div class="state-spinner qr-loading-spinner">
      </div>
      <p class="state-title">Cargando...</p>
    </div>

    <div id="qr-content" class="hidden qr-content-layout">
      <header class="qr-header">
        <h1>Tu Acceso Gratuito</h1>
        <p id="member-name"></p>
      </header>

      <div id="qr-display" class="qr-box">
        <canvas id="qr-canvas"></canvas>
        <p id="qr-code-text" class="qr-code-mono"></p>
      </div>

      <div class="qr-info">
        <p>Válido hasta: <strong id="valid-until"></strong></p>
        <p class="qr-warning">Mostrá este QR en la entrada</p>
      </div>
    </div>

    <div id="qr-unavailable" class="hidden state-block">
      <p class="state-title" id="unavailable-title">Sin evento disponible</p>
      <p class="state-desc" id="unavailable-desc">No hay evento activo esta noche.</p>
    </div>

    <div id="qr-action" class="hidden">
      <button id="btn-generate" class="btn btn-primary btn-lg">
        Generar Mi QR
      </button>
    </div>
  </main>

  <script src="../../assets/js/core/config.js"></script>
  <script src="../../assets/js/members/my-qr.js"></script>
  <script>
    // Simple spinner animation keyframes
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
      `;
    document.head.appendChild(style);
  </script>
</body>

</html>
