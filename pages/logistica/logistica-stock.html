<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Stock Depósito — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
    <link rel="stylesheet" href="../../assets/css/admin-master.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="logistico,admin">

    <!-- Topbar: Golden Standard -->
    <header class="topbar">
        <!-- Left: Breadcrumb -->
        <nav class="breadcrumb topbar-start" aria-label="Navegación">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="logistica-index.html">Logística</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Stock Depósito</span>
        </nav>

        <!-- Center: Search -->
        <div class="topbar-center header-search">
            <input type="text" id="global-search" class="input" placeholder="Ir a..." aria-label="Navegación rápida">
            <svg class="header-search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span class="header-shortcut">⌘K</span>
        </div>

        <!-- Right: Notifications + Avatar -->
        <div class="topbar-end">
            <!-- User Menu Dropdown -->
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">LG</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Logístico</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <!-- Master Navigation -->
                <nav class="master-nav">
                    <a href="logistica-stock.html" class="master-nav-link active">Stock</a>
                    <a href="logistica-distribucion.html" class="master-nav-link">Distribución</a>
                    <a href="logistica-recepcion.html" class="master-nav-link">Recepción</a>
                    <a href="logistica-seguimiento.html" class="master-nav-link">Seguimiento</a>
                </nav>

                <!-- Loading State -->
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando stock...</p>
                        <p class="state-desc">Consultando inventario global</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block">
                        <p class="state-title">Sin resultados</p>
                        <p class="state-desc">No hay registros de stock disponibles.</p>
                        <button class="btn btn-secondary btn-sm mt-2" id="btn-reload-empty">Recargar</button>
                    </div>
                </div>

                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h1 class="dashboard-title dashboard-title-soft">Control de Stock</h1>
                                <p class="dashboard-subtitle-soft">Inventario del depósito central y sucursales.</p>
                            </div>
                            <button class="btn btn-ghost btn-sm" id="btn-refresh" aria-label="Refrescar datos de stock">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 2v6h-6"></path>
                                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                                    <path d="M3 22v-6h6"></path>
                                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                                </svg>
                                Refrescar
                            </button>
                        </div>

                        <!-- Filter Bar -->
                        <div class="sku-filter-bar">
                            <div id="category-tabs" class="pill-group">
                                <!-- JS Injected Tabs -->
                            </div>
                            <div class="filter-spacer"></div>
                            <div class="search-input-wrap">
                                <svg class="search-icon" viewBox="0 0 24 24">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input type="text" id="stock-search" class="input search-input"
                                    placeholder="Buscar SKU..." aria-label="Buscar SKU" />
                            </div>
                        </div>

                        <!-- List Container -->
                        <div class="table-viewport table-shell" id="list-container">
                            <!-- JS Injected Content -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Ajuste -->
    <div class="modal hidden" id="modal-adjust">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Ajuste de Stock</h2>
                <button class="modal-close btn-icon" id="close-modal" aria-label="Cerrar modal">×</button>
            </div>
            <div class="modal-body">
                <p id="adjust-sku-name" class="text-muted mb-4 font-medium"></p>
                <div class="form-group">
                    <label class="form-label" for="adjust-current">Stock Actual Sistema</label>
                    <input type="text" id="adjust-current" class="input" readonly disabled class="bg-surface">
                </div>
                <div class="form-group">
                    <label class="form-label" for="adjust-real">Cantidad Real (Conteo)</label>
                    <input type="number" id="adjust-real" class="input" min="0" required
                        aria-label="Cantidad real contada">
                </div>
                <div class="form-group">
                    <label class="form-label" for="adjust-diff">Diferencia</label>
                    <input type="text" id="adjust-diff" class="input" readonly disabled class="bg-surface">
                </div>
                <div class="form-group">
                    <label class="form-label" for="adjust-reason">Motivo</label>
                    <select id="adjust-reason" class="input select" required aria-label="Motivo del ajuste">
                        <option value="">Seleccionar...</option>
                        <option value="conteo">Conteo Físico</option>
                        <option value="rotura">Rotura</option>
                        <option value="merma">Merma</option>
                        <option value="vencimiento">Vencimiento</option>
                        <option value="devolucion">Devolución</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="adjust-notes">Notas</label>
                    <textarea id="adjust-notes" class="input" rows="2" placeholder="Detalles del ajuste..."
                        aria-label="Notas del ajuste"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-cancel-adjust">Cancelar</button>
                <button class="btn btn-primary" id="btn-confirm-adjust">Confirmar Ajuste</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>

    <!-- Module Script -->
    <script defer src="../../assets/js/modules/logistica/logistica-stock.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/core/custom-dropdown.js"></script>
</body>

</html>
