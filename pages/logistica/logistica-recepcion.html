<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Recepción Log. — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/admin-master.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="logistico,admin">

    <!-- Topbar: Golden Standard -->
    <header class="topbar">
        <nav class="breadcrumb topbar-start">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="logistica-index.html">Logística</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Recepción</span>
        </nav>

        <div class="topbar-center header-search">
            <input type="text" id="global-search" class="input" placeholder="Ir a..." aria-label="Navegación rápida">
            <span class="header-shortcut">⌘K</span>
        </div>

        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">LG</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Usuario</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <nav class="master-nav">
                    <a href="logistica-stock.html" class="master-nav-link">Stock</a>
                    <a href="logistica-distribucion.html" class="master-nav-link">Distribución</a>
                    <a href="logistica-recepcion.html" class="master-nav-link active">Recepción</a>
                    <a href="logistica-seguimiento.html" class="master-nav-link">Seguimiento</a>
                </nav>

                <div class="staff-dashboard">
                    <div class="dashboard-header align-start">
                        <div>
                            <h2 class="dashboard-title dashboard-title-soft">Recepción de Mercadería</h2>
                            <p class="text-sm text-muted">Ingreso de productos al depósito central.</p>
                        </div>
                        <button class="btn btn-primary btn-sm" id="btn-new-receipt">+ Nueva Recepción</button>
                    </div>

                    <div class="sku-filter-bar">
                        <div id="status-tabs" class="pill-group">
                            <button class="filter-pill active" data-status="">Todos</button>
                            <button class="filter-pill" data-status="CONFIRMED">Por Recibir</button>
                            <button class="filter-pill" data-status="RECEIVED">Recibidos</button>
                        </div>
                        <div class="filter-spacer"></div>
                        <button class="btn btn-ghost btn-sm" id="btn-refresh">Refrescar</button>
                    </div>

                    <div class="table-viewport table-shell" id="list-container">
                        <!-- JS Content -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Recepción (Con Orden) -->
    <div class="modal-overlay hidden" id="modal-receive">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Recibir Orden</h2>
                <button class="btn-icon" id="close-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="mb-4 bg-surface p-4 rounded text-sm">
                    <p><strong>Proveedor:</strong> <span id="receive-supplier">-</span></p>
                    <p><strong>Fecha Esperada:</strong> <span id="receive-eta">-</span></p>
                    <p><strong>Total Estimado:</strong> <span id="receive-total">-</span></p>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label class="form-label" for="receive-invoice">Número de Factura/Remito</label>
                        <input type="text" id="receive-invoice" class="input" placeholder="Ej: FC-A-0001-00012345">
                    </div>
                    <div class="form-group flex-1">
                        <label class="form-label" for="receive-invoice-date">Fecha de Factura</label>
                        <input type="date" id="receive-invoice-date" class="input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="receive-invoice-amount">Monto Facturado</label>
                    <input type="number" id="receive-invoice-amount" class="input" placeholder="0.00" min="0"
                        step="0.01">
                </div>
                <div class="table-scroll max-h-250" id="receive-items-container">
                    <!-- JS Items -->
                </div>
                <div class="form-group mt-2">
                    <label class="form-label" for="receive-notes">Notas de Recepción</label>
                    <textarea id="receive-notes" class="input" rows="2" placeholder="Observaciones..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-cancel-receive">Cancelar</button>
                <button class="btn btn-primary" id="btn-confirm-receive">Confirmar Recepción</button>
            </div>
        </div>
    </div>

    <!-- Modal de Nueva Recepción Libre (Sin Orden) -->
    <div class="modal-overlay hidden" id="modal-free-receipt">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Recepción Directa</h2>
                <button class="btn-icon" id="close-free-modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label class="form-label" for="free-supplier">Proveedor</label>
                        <select id="free-supplier" class="input select" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="form-group flex-1">
                        <label class="form-label" for="free-invoice">Factura/Remito</label>
                        <input type="text" id="free-invoice" class="input" placeholder="FC-A-0001...">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="free-sku-select">Agregar Producto</label>
                    <div class="flex gap-2">
                        <select id="free-sku-select" class="input select flex-2">
                            <option value="">Buscar SKU...</option>
                        </select>
                        <input type="number" id="free-qty" class="input flex-1" placeholder="Cant." min="1">
                        <button class="btn btn-secondary btn-sm" id="btn-add-sku">+ Agregar</button>
                    </div>
                </div>
                <div class="table-scroll max-h-200" id="free-items-container">
                    <table class="table" id="free-items-table">
                        <thead>
                            <tr class="table-head">
                                <th class="table-cell is-header cell-pad">SKU</th>
                                <th class="table-cell is-header cell-pad">Cantidad</th>
                                <th class="table-cell is-header cell-pad"></th>
                            </tr>
                        </thead>
                        <tbody id="free-items-body">
                            <tr>
                                <td colspan="3" class="table-cell cell-pad muted">Sin productos</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="form-group mt-2">
                    <label class="form-label" for="free-notes">Notas</label>
                    <textarea id="free-notes" class="input" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-cancel-free">Cancelar</button>
                <button class="btn btn-primary" id="btn-confirm-free">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/modules/logistica/logistica-recepcion.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
</body>

</html>
