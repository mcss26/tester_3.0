<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <title>Seguimiento — Midnight</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/admin-master.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="logistico,admin">

  <!-- Topbar: Golden Standard -->
  <header class="topbar">
    <nav class="breadcrumb topbar-start">
      <span class="breadcrumb-item">
        <a class="breadcrumb-link" href="logistica-index.html">Logística</a>
      </span>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-item current">Seguimiento</span>
    </nav>

    <div class="topbar-center header-search">
      <input type="text" id="global-search" class="input" placeholder="Ir a..." aria-label="Navegación rápida">
      <span class="header-shortcut">⌘K</span>
    </div>

    <div class="topbar-end">
      <div class="dropdown-container">
        <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">LG</button>
        <div class="dropdown-menu dropdown-user hidden" id="user-menu">
          <div class="dropdown-header" id="user-name-display">Usuario</div>
          <div class="dropdown-divider"></div>
          <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
            <svg class="dropdown-icon" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar Sesión
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="page-card-wrap">
      <div class="page-card">

        <nav class="master-nav">
          <a href="logistica-stock.html" class="master-nav-link">Stock</a>
          <a href="logistica-distribucion.html" class="master-nav-link">Distribución</a>
          <a href="logistica-recepcion.html" class="master-nav-link">Recepción</a>
          <a href="logistica-seguimiento.html" class="master-nav-link active">Seguimiento</a>
        </nav>

        <div class="staff-dashboard">
          <div class="dashboard-header align-start">
            <div>
              <h2 class="dashboard-title dashboard-title-soft">Seguimiento de Pedidos</h2>
              <p class="text-sm text-muted">Tracking de órdenes de compra hasta entrega.</p>
            </div>
            <button class="btn btn-ghost btn-sm" id="btn-refresh">Refrescar</button>
          </div>

          <div class="sku-filter-bar">
            <div id="status-tabs" class="pill-group">
              <button class="filter-pill active" data-status="">Todos</button>
              <button class="filter-pill" data-status="ordered">Ordenados</button>
              <button class="filter-pill" data-status="in_transit">En Tránsito</button>
              <button class="filter-pill" data-status="arrived">Llegados</button>
              <button class="filter-pill" data-status="delivered">Entregados</button>
            </div>
          </div>

          <div class="table-viewport table-shell" id="list-container">
            <!-- JS Content -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Slide Panel: Detalle de Orden -->
  <div id="slide-panel" class="slide-panel">
    <div class="panel-header">
      <div class="panel-header-info">
        <h2 class="panel-title" id="panel-title">Detalle de Orden</h2>
        <p class="panel-subtitle">Timeline de seguimiento</p>
      </div>
      <button class="btn-icon btn-close-panel" aria-label="Cerrar">×</button>
    </div>

    <div class="panel-body custom-scroll" id="panel-body">
      <!-- Order Info -->
      <div id="order-info" class="mb-6 card bg-surface">
        <!-- Injected by JS -->
      </div>

      <!-- Timeline -->
      <div class="timeline-container" id="timeline-container">
        <h4 class="text-sm font-bold mb-3">Historial de Estados</h4>
        <div id="timeline-list" class="timeline">
          <!-- Injected by JS -->
        </div>
      </div>

      <!-- Add Event Form -->
      <div class="mt-6 p-4 bg-surface card" id="add-event-form">
        <h4 class="text-sm font-bold mb-3">Agregar Actualización</h4>
        <div class="form-group mb-3">
          <label class="form-label" for="new-status">Nuevo Estado</label>
          <select id="new-status" class="input select w-full">
            <option value="">Seleccionar...</option>
            <option value="ordered">📋 Ordenado</option>
            <option value="in_transit">🚚 En Tránsito</option>
            <option value="arrived">📦 Llegado a Depósito</option>
            <option value="delivered">✅ Entregado</option>
          </select>
        </div>
        <div class="form-group mb-3">
          <label class="form-label" for="event-notes">Notas (opcional)</label>
          <textarea id="event-notes" class="input w-full" rows="2"
            placeholder="Ej: Confirmado por proveedor..."></textarea>
        </div>
      </div>
    </div>

    <footer class="panel-footer row-flex justify-end gap-sm">
      <button class="btn btn-secondary btn-sm btn-close-panel">CERRAR</button>
      <button class="btn btn-primary btn-sm" id="btn-add-event">GUARDAR ESTADO</button>
    </footer>
  </div>
  <div class="panel-overlay"></div>

  <!-- Scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="../../assets/js/core/config.js"></script>
  <script defer src="../../assets/js/core/supabase-client.js"></script>
  <script defer src="../../assets/js/core/auth.js"></script>
  <script defer src="../../assets/js/core/utils.js"></script>
  <script defer src="../../assets/js/core/toast.js"></script>
  <script defer src="../../assets/js/core/panel.js"></script>
  <script defer src="../../assets/js/modules/logistica/logistica-seguimiento.js"></script>
  <script defer src="../../assets/js/core/navigation.js"></script>
</body>

</html>
