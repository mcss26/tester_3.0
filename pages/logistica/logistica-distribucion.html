<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Distribución — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
    <link rel="stylesheet" href="../../assets/css/admin-master.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="logistico,admin">

    <!-- Topbar: Golden Standard -->
    <header class="topbar">
        <nav class="breadcrumb topbar-start" aria-label="Navegación">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="logistica-index.html">Logística</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Distribución</span>
        </nav>

        <div class="topbar-center header-search">
            <input type="text" id="global-search" class="input" placeholder="Ir a..." aria-label="Navegación rápida">
            <svg class="header-search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span class="header-shortcut">⌘K</span>
        </div>

        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">LG</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Logístico</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <!-- Master Navigation -->
                <nav class="master-nav">
                    <a href="logistica-stock.html" class="master-nav-link">Stock</a>
                    <a href="logistica-distribucion.html" class="master-nav-link active">Distribución</a>
                    <a href="logistica-recepcion.html" class="master-nav-link">Recepción</a>
                    <a href="logistica-seguimiento.html" class="master-nav-link">Seguimiento</a>
                </nav>

                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Distribución a Barras</h2>
                                <p class="dashboard-subtitle-soft">Gestión de pedidos internos y despachos a sucursales.
                                </p>
                            </div>
                            <button class="btn btn-ghost btn-sm" id="btn-refresh"
                                aria-label="Refrescar pedidos">Refrescar</button>
                        </div>

                        <!-- Filter Bar -->
                        <div class="sku-filter-bar">
                            <div id="status-tabs" class="pill-group">
                                <button class="filter-pill active" data-status="">Todos</button>
                                <button class="filter-pill" data-status="PENDING">Pendientes</button>
                                <button class="filter-pill" data-status="APPROVED">Aprobados</button>
                                <button class="filter-pill" data-status="DISPATCHED">Despachados</button>
                            </div>
                        </div>

                        <div class="table-viewport table-shell" id="list-container">
                            <!-- JS Content -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Despacho -->
    <div class="modal hidden" id="modal-dispatch">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Despachar Pedido</h2>
                <button class="modal-close btn-icon" id="close-modal" aria-label="Cerrar modal">✕</button>
            </div>
            <div class="modal-body">
                <div class="mb-4 bg-surface p-4 rounded text-sm">
                    <p><strong>Solicitante:</strong> <span id="dispatch-requester">-</span></p>
                    <p><strong>Fecha Deseada:</strong> <span id="dispatch-date">-</span></p>
                    <p><strong>Prioridad:</strong> <span id="dispatch-priority">-</span></p>
                    <p class="text-muted mt-2"><span id="dispatch-notes"></span></p>
                </div>
                <div class="table-scroll max-h-300" id="dispatch-items-container">
                    <!-- Items JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-cancel-dispatch"
                    aria-label="Cancelar despacho">Cancelar</button>
                <button class="btn btn-primary" id="btn-confirm-dispatch" aria-label="Confirmar despacho">Confirmar
                    Despacho</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/modules/logistica/logistica-distribucion.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
</body>

</html>
