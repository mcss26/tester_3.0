<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Cierre Semanal — Midnight</title>
    <!-- Design Tokens & Global Components -->
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="../../assets/css/admin-semanal.css">
</head>

<body class="admin-shell admin-scroll">

    <!-- Topbar: Golden Standard -->
    <header class="topbar">
        <!-- Left: Breadcrumb -->
        <nav class="breadcrumb topbar-start">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="admin-index.html">Administración</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Cierre Semanal</span>
        </nav>

        <!-- Center: Search (Optional, or Empty per Standard if not needed) -->
        <div class="topbar-center header-search">
            <!-- Keeping empty or searching logic if applies. For now, empty or standard placeholder -->
        </div>

        <!-- Right: Notifications + User -->
        <div class="topbar-end">
            <!-- Notifications (Static Mockup for Standard Coherence) -->
            <div class="dropdown-container">
                <button class="icon-btn" aria-label="Notificaciones">
                    <svg class="icon-notification" viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
            </div>
            <!-- User Avatar -->
            <div class="dropdown-container">
                <div class="avatar avatar-sm">AD</div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card overflow-visible">

                <!-- Loading State -->
                <div id="page-card-loading" class="page-card-loading">
                    <div class="state-spinner"></div>
                </div>

                <!-- Dashboard Header -->
                <div class="dashboard-header align-start">
                    <div>
                        <h2 class="dashboard-title">Cierre Semanal</h2>
                        <p class="dashboard-subtitle dashboard-subtitle-soft">Control de ingresos, egresos y
                            estimaciones fiscales</p>
                    </div>
                    <div class="actions-bar">
                        <!-- Week Selector -->
                        <select id="weekSelect" class="week-select"></select>
                        <!-- Freeze Button -->
                        <button id="btnFreeze" class="btn btn-primary hidden">
                            ❄️ CONGELAR SEMANA
                        </button>
                    </div>
                </div>

                <!-- Live Status Banner -->
                <div id="statusBanner" class="status-banner hidden">
                    ⚠️ VISTA PRELIMINAR (EN VIVO)
                </div>

                <!-- KPI Grid -->
                <div class="weekly-grid">

                    <!-- White Balance -->
                    <div class="balance-card">
                        <p class="balance-label">Balance Blanco (A/C/B)</p>
                        <div class="balance-row">
                            <div>
                                <span class="balance-sub-label">INGRESOS</span>
                                <span class="balance-sub-value text-success" id="valIncWhite">$0</span>
                            </div>
                            <div class="text-right">
                                <span class="balance-sub-label">EGESTOS</span>
                                <span class="balance-sub-value text-error" id="valExpWhite">$0</span>
                            </div>
                        </div>
                        <div class="card-divider"></div>
                        <div class="text-center">
                            <span class="balance-value-lg" id="valBalWhite">$0</span>
                        </div>
                    </div>

                    <!-- Black Balance -->
                    <div class="balance-card">
                        <p class="balance-label">Balance Efectivo (X)</p>
                        <div class="balance-row">
                            <div>
                                <span class="balance-sub-label">INGRESOS</span>
                                <span class="balance-sub-value text-success" id="valIncBlack">$0</span>
                            </div>
                            <div class="text-right">
                                <span class="balance-sub-label">EGESTOS</span>
                                <span class="balance-sub-value text-error" id="valExpBlack">$0</span>
                            </div>
                        </div>
                        <div class="card-divider"></div>
                        <div class="text-center">
                            <span class="balance-value-lg" id="valBalBlack">$0</span>
                        </div>
                    </div>

                    <!-- Tax Estimate -->
                    <div class="balance-card" style="border-color: rgba(251, 191, 36, 0.3);">
                        <p class="balance-label text-warning">Est. Impositivo</p>
                        <div
                            style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                            <span class="balance-sub-label" style="text-align: center; margin-bottom: 8px;">IVA + IIBB +
                                Muni (Aprox)</span>
                            <p class="balance-value-lg text-warning" id="valTaxEst">$0</p>
                        </div>
                        <div class="text-center">
                            <!-- Spacer or additional info could go here -->
                        </div>
                    </div>

                </div>

                <!-- Here we could add a detailed table if defined in requirements, for now respecting original content scope -->

            </div>
        </div>
    </main>

    <!-- Dependencies -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/supabase-client.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>

    <!-- Module Logic -->
    <script src="../../assets/js/modules/admin/admin-semanal.js"></script>
</body>

</html>
