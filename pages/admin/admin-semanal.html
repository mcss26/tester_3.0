<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight — Cierre Semanal</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .weekly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        .balance-card {
            background: var(--surface-card);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-md);
            padding: var(--space-md);
        }

        .balance-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .balance-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tax-alert {
            color: var(--error);
        }

        .tax-ok {
            color: var(--success);
        }
    </style>
</head>

<body class="app-shell admin-shell admin-scroll">
    <header class="app-topbar">
        <div class="topbar-left">
            <button class="btn-icon btn-icon-flat" data-go="pages/admin/admin-index.html">←</button>
            <span class="topbar-back">INICIO</span>
        </div>
        <nav class="topbar-center">
            <span class="topbar-brand">CIERRE SEMANAL</span>
        </nav>
        <div class="topbar-right">
            <div class="user-profile"><span id="user-name">Admin</span></div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card dashboard-view">

                <!-- Week Selector -->
                <div class="filter-bar">
                    <div class="filter-group">
                        <label class="text-sm muted mr-2">Semana:</label>
                        <select id="weekSelect" class="input input-auto-width"></select>
                    </div>
                    <div class="filter-actions h-full">
                        <button id="btnFreeze" class="btn btn-primary hidden">❄️ CONGELAR SEMANA</button>
                    </div>
                </div>

                <!-- Live Status -->
                <div id="statusBanner" class="p-4 mb-4 rounded bg-surface-2 hidden">
                    <p class="text-center font-bold">⚠️ VISTA PRELIMINAR (EN VIVO)</p>
                </div>

                <!-- KPI Grid -->
                <div class="weekly-grid">
                    <!-- White Balance -->
                    <div class="balance-card">
                        <p class="balance-label">Balance Blanco (A/C/B)</p>
                        <div class="row-flex justify-between mt-2">
                            <div>
                                <span class="text-xs muted block">INGRESOS</span>
                                <span class="font-mono text-lg text-success" id="valIncWhite">$0</span>
                            </div>
                            <div class="text-right">
                                <span class="text-xs muted block">EGESTOS</span>
                                <span class="font-mono text-lg text-error" id="valExpWhite">$0</span>
                            </div>
                        </div>
                        <hr class="my-2 border-white/10">
                        <div class="text-center">
                            <span class="font-mono font-bold text-xl" id="valBalWhite">$0</span>
                        </div>
                    </div>

                    <!-- Black Balance -->
                    <div class="balance-card">
                        <p class="balance-label">Balance Efectivo (X)</p>
                        <div class="row-flex justify-between mt-2">
                            <div>
                                <span class="text-xs muted block">INGRESOS</span>
                                <span class="font-mono text-lg text-success" id="valIncBlack">$0</span>
                            </div>
                            <div class="text-right">
                                <span class="text-xs muted block">EGESTOS</span>
                                <span class="font-mono text-lg text-error" id="valExpBlack">$0</span>
                            </div>
                        </div>
                        <hr class="my-2 border-white/10">
                        <div class="text-center">
                            <span class="font-mono font-bold text-xl" id="valBalBlack">$0</span>
                        </div>
                    </div>

                    <!-- Tax Est -->
                    <div class="balance-card" style="border-color: var(--accent-gold);">
                        <p class="balance-label" style="color: var(--accent-gold);">Est. Impositivo</p>
                        <div class="mt-4 text-center">
                            <p class="text-xs muted mb-1">IVA + IIBB + Muni (Aprox)</p>
                            <p class="balance-value text-warning" id="valTaxEst">$0</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/supabase-client.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/toast.js"></script>
    <script src="../../assets/js/core/navigation.js"></script>

    <script src="../../assets/js/modules/admin/admin-semanal.js"></script>
</body>

</html>
