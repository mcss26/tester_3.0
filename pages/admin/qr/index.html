<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../../assets/img/favicon.svg">
    <title>QR Gestión — Midnight</title>
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/components.css">
    <link rel="stylesheet" href="../../../assets/css/admin-central-stock.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="admin,encargado_caja">

    <!-- TOPBAR (Golden Standard) -->
    <header class="topbar">
        <!-- Left: Breadcrumb -->
        <nav class="breadcrumb topbar-start">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="../admin-index.html">Admin</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Gestión QR</span>
        </nav>

        <!-- Center: empty -->
        <div class="topbar-center"></div>

        <!-- Right: Avatar + Dropdown -->
        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">...</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Usuario</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <p class="stat-label">Total Generados</p>
                        <p class="stat-value" id="stat-total">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="stat-label text-success">Acreditados</p>
                        <p class="stat-value" id="stat-accredited">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="stat-label text-error">Pendientes</p>
                        <p class="stat-value" id="stat-pending">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="stat-label">Lotes Activos</p>
                        <p class="stat-value" id="stat-batches">0</p>
                    </div>
                </div>

                <!-- Actions -->
                <div class="action-bar">
                    <a href="generator.html" class="btn btn-primary">
                        + Nuevo Lote
                    </a>
                </div>

                <!-- Batches List -->
                <div class="section-header">
                    <h2 class="section-title">Lotes Recientes</h2>
                </div>
                <div class="table-scroll">
                    <table class="batches-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Origen</th>
                                <th>Precio</th>
                                <th>Generados</th>
                                <th>Acreditados</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="batches-list">
                            <tr>
                                <td colspan="8" class="text-center muted" style="padding:var(--space-lg)">Cargando...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Recent Activity -->
                <div class="section-header">
                    <h2 class="section-title">Últimos Accesos</h2>
                </div>
                <div id="activity-list" class="list-stack">
                    <!-- Injected by JS -->
                </div>

            </div>
        </div>
    </main>

    <!-- Core Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../../assets/js/core/config.js"></script>
    <script defer src="../../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../../assets/js/core/utils.js"></script>
    <script defer src="../../../assets/js/core/auth.js"></script>
    <script defer src="../../../assets/js/core/toast.js"></script>
    <script defer src="../../../assets/js/core/work-day-helper.js"></script>
    <script src="../../../assets/js/core/navigation.js"></script>
    <script defer src="../../../assets/js/modules/admin/qr-dashboard.js"></script>

</body>

</html>
