<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co https://cdn.jsdelivr.net;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../../assets/img/favicon.svg">
    <title>QR Monitor � Midnight</title>
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/base.css">
    <link rel="stylesheet" href="../../../assets/css/layout.css">
    <link rel="stylesheet" href="../../../assets/css/components.css">
    <link rel="stylesheet" href="../../../assets/css/forms.css">
    <link rel="stylesheet" href="../../../assets/css/utilities.css">
</head>

<body class="app-shell admin-shell" data-allowed-roles="admin,manager">

    <!-- Header -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </a>
            <h1 class="topbar-brand">Monitor en Vivo</h1>
        </div>
        <nav class="topbar-center"></nav>
        <div class="topbar-right">
            <button id="btnRefresh" class="btn btn-secondary">
                Actualizar
            </button>
        </div>
    </header>

    <main class="dashboard-content">

        <!-- Main Stats Card -->
        <div class="page-card large-monitor">
            <div class="kpi-grid">
                <div class="w-full">
                    <h3 class="form-label">Progreso General de Acreditaci�n</h3>

                    <!-- Progress Bar Component -->
                    <div class="progress-bar">
                        <div id="mainProgressBar" class="progress-bar-fill"></div>
                    </div>

                    <div class="actions-bar">
                        <span id="progressPercent" class="stat-value">0%</span>
                        <span id="progressRatio" class="muted">0 / 0</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div id="totalScanned" class="stat-value stat-value-hero">0</div>
                    <div class="stat-label text-success">Ingresados</div>
                </div>
            </div>
        </div>

        <!-- Batch Breakdown -->
        <section>
            <div class="section-header">
                <h2 class="section-title">Desglose por Lote</h2>
            </div>
            <div id="batchList" class="kpi-grid">
                <!-- Batch Cards Injected Here -->
                <div class="muted text-center">Cargando datos...</div>
            </div>
        </section>

    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../../assets/js/core/config.js"></script>
    <script defer src="../../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../../assets/js/core/auth.js"></script>
    <script defer src="../../../assets/js/core/utils.js"></script>
    <script defer src="../../../assets/js/modules/admin/qr-monitor.js"></script>
    <script defer src="../../../assets/js/core/topbar.js"></script>
  </body>

</html>
