<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../../assets/img/favicon.svg">
    <title>QR Generador — Midnight</title>
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/components.css">
    <!-- QR Admin specific styles (Printing, etc) -->

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
</head>

<body class="app-shell admin-shell" data-allowed-roles="admin">

    <header class="topbar">
        <div class="topbar-left">
            <button id="btnBack" type="button" class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Volver
            </button>
            <h1 class="topbar-brand">Nuevo Lote de Accesos</h1>
        </div>
        <nav class="topbar-center"></nav>
        <div class="topbar-right">
            <button id="btnPreview" class="btn btn-secondary">Previsualizar</button>
            <button id="btnPrint" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 6 2 18 2 18 9" />
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                    <rect width="12" height="8" x="6" y="14" />
                </svg>
                Guardar e Imprimir
            </button>
        </div>
    </header>

    <main class="admin-container">
        <div class="qr-grid">
            <!-- Config Column -->
            <div>
                <div class="qr-card">
                    <h2 class="form-label">Información del Lote</h2>

                    <div class="field">
                        <label>Nombre del Lote</label>
                        <input id="batchName" type="text" placeholder="Ej: VIP Viernes 26/01" class="w-full">
                    </div>

                    <div class="field">
                        <label>Tipo Financiero</label>
                        <select id="financialType" class="w-full">
                            <option value="INVITACION">Invitación (Gratis)</option>
                            <option value="VENTA">Venta (Entrada Paga)</option>
                            <option value="CORTESIA">Cortesía (RRPP)</option>
                        </select>
                    </div>

                    <div class="field hidden" id="marketSourceField">
                        <label>Origen (Market Source)</label>
                        <select id="marketSource" class="w-full">
                            <option value="" disabled selected>Seleccionar Origen</option>
                            <option value="PASSLINE">Passline</option>
                            <option value="BOLETERIA">Boletería Física</option>
                            <option value="RRPP">Promotores / RRPP</option>
                        </select>
                        <p class="hint">Usado para la conciliación de caja.</p>
                    </div>

                    <div class="field hidden" id="priceField">
                        <label>Precio Unitario ($)</label>
                        <input id="unitPrice" type="number" min="0" value="0" placeholder="0.00">
                    </div>

                    <hr class="hr-divider">

                    <h2 class="form-label">Generación</h2>
                    <div class="field">
                        <label>Cantidad</label>
                        <input id="qty" type="number" min="1" max="500" value="20">
                    </div>

                    <div class="field">
                        <label>URL / Prefijo (Opcional)</label>
                        <div class="list-stack">
                            <input id="baseText" type="text" placeholder="https://..."
                                value="https://midnightclub.com.ar/checkin">
                            <p class="hint text-xs">Se anexa el UUID único al final.</p>
                        </div>
                    </div>

                    <hr class="hr-divider">
                    <h2 class="form-label">Impresión</h2>

                    <div class="form-row">
                        <div class="field">
                            <label>Papel</label>
                            <select id="paper">
                                <option value="80">80mm</option>
                                <option value="58">58mm</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>QR Size</label>
                            <select id="qrSize">
                                <option value="28">28mm</option>
                                <option value="35" selected>35mm</option>
                                <option value="40">40mm</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Title</label>
                            <input id="titleText" type="text" value="MIDNIGHT">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview Column -->
            <div class="qr-card h-full">
                <div class="preview-header">
                    <span class="preview-title">Vista Previa</span>
                    <button id="btnClear" class="btn-ghost btn-sm muted">Limpiar</button>
                </div>
                <div id="previewArea" class="preview-area">
                </div>
                <div class="muted text-center text-xs" id="previewMeta">
                    Listo para generar
                </div>
            </div>
        </div>
    </main>

    <!-- Hidden Print Area -->
    <div id="printArea"></div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../../assets/js/core/config.js"></script>
    <script defer src="../../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../../assets/js/core/auth.js"></script>
    <script defer src="../../../assets/js/modules/admin/qr-generator.js"></script>
</body>

</html>
