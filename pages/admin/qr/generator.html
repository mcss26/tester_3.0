<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../../assets/img/favicon.svg">
    <title>QR Generador — Midnight</title>
    <link rel="stylesheet" href="../../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/components.css">
    <link rel="stylesheet" href="../../../assets/css/qr-generator.css">

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="admin,contable">

    <!-- TOPBAR (Golden Standard) -->
    <header class="topbar">
        <!-- Left: Breadcrumb -->
        <nav class="breadcrumb topbar-start">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="../admin-index.html">Admin</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="./index.html">QR</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Generador</span>
        </nav>

        <!-- Center: empty -->
        <div class="topbar-center"></div>

        <!-- Right: Avatar + Dropdown -->
        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">...</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Usuario</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">

            <!-- Dashboard Header (OUTSIDE card per Golden Standard) -->
            <div class="dashboard-header align-start">
                <div>
                    <h1 class="dashboard-title dashboard-title-soft">Generador QR</h1>
                    <p class="dashboard-subtitle dashboard-subtitle-soft">
                        Crear lotes de códigos QR para entradas y accesos
                    </p>
                </div>
                <div class="actions-bar">
                    <button id="btnPrint" class="btn btn-primary" aria-label="Guardar e imprimir lote">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 6 2 18 2 18 9"></polyline>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2">
                            </path>
                            <rect width="12" height="8" x="6" y="14"></rect>
                        </svg>
                        Guardar e Imprimir
                    </button>
                </div>
            </div>

            <div class="page-card">

                <!-- 2-Column Layout: Config + Preview -->
                <div class="qr-gen-layout">

                    <!-- LEFT: Config Sidebar -->
                    <aside class="qr-gen-config">
                        <h2 class="section-label">Información del Lote</h2>

                        <div class="field">
                            <label for="batchName">Nombre del Lote</label>
                            <input id="batchName" type="text" placeholder="Ej: VIP Viernes 26/01" class="w-full"
                                aria-label="Nombre del lote">
                        </div>

                        <div class="field">
                            <label for="financialType">Tipo Financiero</label>
                            <select id="financialType" class="w-full" aria-label="Tipo financiero">
                                <option value="INVITACION">Invitación (Gratis)</option>
                                <option value="VENTA">Venta (Entrada Paga)</option>
                                <option value="CORTESIA">Cortesía (RRPP)</option>
                            </select>
                        </div>

                        <div class="field hidden" id="marketSourceField">
                            <label for="marketSource">Origen (Market Source)</label>
                            <select id="marketSource" class="w-full" aria-label="Origen de mercado">
                                <option value="" disabled selected>Seleccionar Origen</option>
                                <option value="PASSLINE">Passline</option>
                                <option value="BOLETERIA">Boletería Física</option>
                                <option value="RRPP">Promotores / RRPP</option>
                            </select>
                            <p class="hint">Usado para la conciliación de caja.</p>
                        </div>

                        <div class="field hidden" id="priceField">
                            <label for="unitPrice">Precio Unitario ($)</label>
                            <input id="unitPrice" type="number" min="0" value="0" placeholder="0.00">
                        </div>

                        <hr class="qr-gen-divider">

                        <h2 class="section-label">Generación</h2>
                        <div class="field">
                            <label for="qty">Cantidad</label>
                            <input id="qty" type="number" min="1" max="500" value="20">
                        </div>

                        <div class="field">
                            <label for="baseText">URL / Prefijo (Opcional)</label>
                            <input id="baseText" type="text" placeholder="https://..."
                                value="https://midnightclub.com.ar/checkin">
                            <p class="hint">Se anexa el UUID único al final.</p>
                        </div>

                        <hr class="qr-gen-divider">

                        <h2 class="section-label">Impresión</h2>
                        <div class="qr-gen-print-row">
                            <div class="field">
                                <label for="paper">Papel</label>
                                <select id="paper">
                                    <option value="80">80mm</option>
                                    <option value="58">58mm</option>
                                </select>
                            </div>
                            <div class="field">
                                <label for="qrSize">QR Size</label>
                                <select id="qrSize">
                                    <option value="28">28mm</option>
                                    <option value="35" selected>35mm</option>
                                    <option value="40">40mm</option>
                                </select>
                            </div>
                            <div class="field">
                                <label for="titleText">Título</label>
                                <input id="titleText" type="text" value="MIDNIGHT">
                            </div>
                        </div>

                        <!-- Preview Button -->
                        <button id="btnPreview" class="btn btn-secondary w-full" aria-label="Previsualizar QR">
                            Previsualizar
                        </button>
                    </aside>

                    <!-- RIGHT: Preview Panel -->
                    <div class="qr-gen-preview">
                        <div class="qr-gen-preview-header">
                            <span class="qr-gen-preview-title">Vista Previa</span>
                            <button id="btnClear" class="btn btn-ghost btn-sm" aria-label="Limpiar vista previa">
                                Limpiar
                            </button>
                        </div>

                        <div id="previewArea" class="qr-gen-preview-grid">
                            <!-- Empty State -->
                            <div class="qr-gen-empty" id="previewEmpty">
                                <svg class="qr-gen-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                </svg>
                                <span class="qr-gen-empty-text">Configurá y hacé clic en Previsualizar</span>
                            </div>
                        </div>

                        <div class="qr-gen-preview-meta" id="previewMeta">
                            Listo para generar
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Hidden Print Area -->
    <div id="printArea"></div>

    <!-- Core Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../../assets/js/core/config.js"></script>
    <script defer src="../../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../../assets/js/core/utils.js"></script>
    <script defer src="../../../assets/js/core/auth.js"></script>
    <script defer src="../../../assets/js/core/toast.js"></script>
    <script src="../../../assets/js/core/navigation.js"></script>
    <script defer src="../../../assets/js/modules/admin/qr-generator.js"></script>
</body>

</html>
