<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Categorías - FormulaMid</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell admin-shell admin-scroll admin-categorias" data-allowed-roles="admin,contable">

    <header class="app-topbar">
        <div class="topbar-left">
            <button class="btn-icon btn-icon-flat" data-go="pages/admin/admin-index.html" aria-label="Volver">←</button>
            <span class="topbar-back">INICIO</span>
        </div>

        <nav class="topbar-center topbar-nav-split">
            <div class="topbar-nav-group left">
                <button class="topbar-link is-fade-1" data-go="pages/admin/admin-master-sku.html">SKU</button>
                <button class="topbar-link is-fade-2" data-go="pages/admin/admin-central-stock.html">Recetas</button>
                <button class="topbar-link is-fade-3"
                    data-go="pages/admin/admin-master-proveedores.html">Proveedores</button>
            </div>
            <div class="topbar-nav-group center">
                <button class="topbar-link is-center active"
                    data-go="pages/admin/admin-master-categorias.html">Categorías</button>
            </div>
            <div class="topbar-nav-group right">
                <button class="topbar-link is-fade-1" data-go="pages/admin/admin-pagos.html">Pagos</button>
                <button class="topbar-link is-fade-2"
                    data-go="pages/admin/admin-master-tarifario.html">Tarifario</button>
                <button class="topbar-link is-fade-3" data-go="pages/admin/admin-master-pos.html">POS</button>
            </div>
        </nav>

        <div class="topbar-right">
            <span class="system-status-pill status-open topbar-pill topbar-pill-quiet">ESTADO: OK</span>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-spinner" aria-hidden="true"></div>
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando categorías...</p>
                        <p class="state-desc">Esto puede tardar unos segundos</p>
                    </div>
                </div>
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block loading">
                        <p class="state-title">Sin resultados</p>
                        <p class="state-desc">Prueba con otro término de búsqueda.</p>
                        <button class="btn-ghost btn-sm mt-2" id="btn-clear-search">Limpiar búsqueda y ver
                            todos</button>
                    </div>
                </div>
                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Gestión de categorías</h2>
                                <p class="dashboard-subtitle dashboard-subtitle-soft">Listado y control de categorías
                                </p>
                            </div>
                            <button class="btn-icon btn-icon-flat btn-icon-plus" id="btn-new"
                                aria-label="Nueva categoría">+</button>
                        </div>

                        <div class="filter-bar filter-bar-compact" aria-label="Filtros de categorías">
                            <div class="filter-group">
                                <button
                                    class="status-pill status-neutral topbar-pill topbar-pill-quiet filter-pill active"
                                    data-status="all" aria-label="Mostrar todas las categorías">
                                    Total <span class="pill-count" id="categories-total">0</span>
                                </button>
                                <button class="status-pill status-success topbar-pill topbar-pill-quiet filter-pill"
                                    data-status="active" aria-label="Mostrar categorías activas">
                                    Activas <span class="pill-count" id="categories-active">0</span>
                                </button>
                                <button class="status-pill status-error topbar-pill topbar-pill-quiet filter-pill"
                                    data-status="inactive" aria-label="Mostrar categorías inactivas">
                                    Inactivas <span class="pill-count" id="categories-inactive">0</span>
                                </button>
                            </div>
                            <div class="filter-actions">
                                <input type="search" id="search-input" class="input input-compact filter-input"
                                    placeholder="Buscar categoría..." aria-label="Buscar categoría" />
                            </div>
                        </div>

                        <!-- List Container (Managed by JS) -->
                        <div class="staff-list table-viewport table-shell" id="list-container">
                            <!-- Content injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Slide Panel -->
    <div class="panel-overlay" id="panel-overlay"></div>
    <div class="slide-panel" id="slide-panel">
        <div class="panel-header">
            <h3 class="panel-title" id="panel-title">Nueva Categoría</h3>
            <button class="panel-close" id="btn-close-panel" aria-label="Cerrar panel">×</button>
        </div>
        <div class="panel-body" id="panel-form-container">
            <div id="panel-error" class="panel-error"></div>

            <div class="form-group">
                <label for="cat-nombre" class="form-label">Nombre *</label>
                <input type="text" id="cat-nombre" class="input" placeholder="Ej: Bebidas sin alcohol" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="cat-active">Estado</label>
                <label class="checkbox-row">
                    <input type="checkbox" id="cat-active" checked>
                    <span>Activo</span>
                </label>
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn-secondary" id="btn-cancel">Cancelar</button>
            <button class="btn-primary" id="btn-save">Guardar</button>
        </div>
    </div>
    <!-- Scripts -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <!-- Shared Panel Logic -->
    <script defer src="../../assets/js/core/panel.js"></script>
    <!-- Page Specific Script -->
    <script defer src="../../assets/js/modules/admin/admin-master-categorias.js"></script>

    <!-- Shared Navigation Script -->
    <script src="../../assets/js/core/navigation.js"></script>
</body>

</html>
