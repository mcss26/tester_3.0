<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co https://cdn.jsdelivr.net;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
   <meta name="theme-color" content="#000000">
   <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
   <title>Admin — Midnight</title>
   <link rel="stylesheet" href="../../assets/css/tokens.css">
   <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
   <link rel="stylesheet" href="../../assets/css/admin-central-stock.css">
   <link rel="stylesheet" href="../../assets/css/launcher.css">
</head>

<body class="app-shell admin-shell launcher-page" data-allowed-roles="admin">

   <!-- TOPBAR (Same as admin-central-stock) -->
   <header class="topbar">
      <!-- Left: Breadcrumb -->
      <div class="topbar-start">
         <nav class="breadcrumb" aria-label="Navegación de migas">
            <span class="breadcrumb-item current">ADMINISTRACIÓN</span>
         </nav>
      </div>

      <!-- Center: Workday Status -->
      <div class="topbar-center">
         <div id="workday-status" class="workday-status status-closed">
            <span class="workday-dot"></span>
            <span id="workday-text">Cargando...</span>
         </div>
      </div>

      <!-- Right: Notifications + Avatar -->
      <div class="topbar-end">

         <!-- User Menu Dropdown -->
         <div class="dropdown-container">
            <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario" aria-haspopup="true"
               aria-expanded="false">...</button>
            <div class="dropdown-menu dropdown-user hidden" id="user-menu" role="menu">
               <div class="dropdown-header" id="user-name-display">Usuario</div>
               <div class="dropdown-divider"></div>
               <a href="./admin-config.html" class="dropdown-item">
                  <svg class="dropdown-icon" viewBox="0 0 24 24">
                     <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                     <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  Perfil
               </a>
               <div class="dropdown-divider"></div>
               <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                  <svg class="dropdown-icon" viewBox="0 0 24 24">
                     <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                     <polyline points="16 17 21 12 16 7"></polyline>
                     <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Cerrar Sesión
               </a>
            </div>
         </div>
      </div>
   </header>

   <!-- CENTER CONTENT -->
   <main class="page-shell launcher-center">
      <div class="dashboard-header">
         <div>
            <h2 class="dashboard-title dashboard-title-soft">MIDNIGHT CLUB</h2>
            <p class="dashboard-subtitle dashboard-subtitle-soft">Panel de Administración</p>
         </div>
      </div>

      <!-- Search Bar -->
      <div class="search-wrapper">
         <input type="text" id="global-search" class="search-input" placeholder="Buscar..."
            aria-label="Navegación rápida">
         <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
         </svg>
      </div>

      <nav class="main-nav" aria-label="Módulos de administración">
         <a href="admin-workdays.html" class="nav-link" aria-label="Gestión de Jornadas">Jornadas</a>
         <a href="admin-central-stock.html" class="nav-link" aria-label="Stock Central e Inventario">Stock Central</a>
         <a href="admin-pagos.html" class="nav-link" aria-label="Gestión de Pagos">Pagos</a>
         <a href="admin-solicitudes.html" class="nav-link" aria-label="Solicitudes de Compra">Solicitudes</a>
         <a href="admin-reportes.html" class="nav-link" aria-label="Reportes y Análisis">Reportes</a>
         <a href="admin-semanal.html" class="nav-link" aria-label="Balance Semanal">Semanal</a>
         <a href="../operativo/operativo-index.html" class="nav-link" aria-label="Módulo Operativo">Operativo</a>
      </nav>
   </main>

   <!-- FOOTER -->
   <footer class="launcher-footer">
      &copy; 2026 Midnight Systems
   </footer>

   <!-- Core Scripts -->
   <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
   <script defer src="../../assets/js/core/config.js"></script>
   <script defer src="../../assets/js/core/supabase-client.js"></script>
   <script defer src="../../assets/js/core/utils.js"></script>
   <script defer src="../../assets/js/core/auth.js"></script>
   <script defer src="../../assets/js/core/toast.js"></script>
   <script defer src="../../assets/js/core/work-day-helper.js"></script>
   <script defer src="../../assets/js/core/navigation.js"></script>

   <script defer src="../../assets/js/modules/admin/admin-index.js"></script>

</body>

</html>
