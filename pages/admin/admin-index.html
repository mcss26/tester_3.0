<!DOCTYPE html>
<html lang="es">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Midnight Club - Admin</title>
 <link rel="stylesheet" href="../../assets/css/tokens.css">
 <link rel="stylesheet" href="../../assets/css/components.css">
 <link rel="stylesheet" href="../../assets/css/admin-central-stock.css">
 <style>
  /* LAUNCHER-SPECIFIC OVERRIDES */
  body.launcher-page {
   background: var(--bg-body);
   overflow: hidden;
  }

  .launcher-center {
   flex: 1;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   gap: 12px;
   margin-top: calc(var(--topbar-height) + 40px);
  }

  .main-title {
   font-size: 64px;
   font-weight: 800;
   color: var(--text-primary);
   letter-spacing: -1px;
   margin: 0;
   text-align: center;
  }

  /* WORKDAY STATUS BADGE - Center position */
  .workday-status {
   display: flex;
   align-items: center;
   gap: 8px;
   padding: 6px 14px;
   border-radius: 99px;
   font-size: 11px;
   font-weight: 600;
   letter-spacing: 0.5px;
   text-transform: uppercase;
   transition: all 0.3s ease;
  }

  .workday-status.status-open {
   border: 1px solid rgba(74, 222, 128, 0.3);
   background: rgba(74, 222, 128, 0.08);
   color: #4ade80;
  }

  .workday-status.status-planning {
   border: 1px solid rgba(251, 191, 36, 0.3);
   background: rgba(251, 191, 36, 0.08);
   color: #fbbf24;
  }

  .workday-status.status-closed {
   border: 1px solid rgba(161, 161, 170, 0.3);
   background: rgba(161, 161, 170, 0.08);
   color: #a1a1aa;
  }

  .workday-dot {
   width: 6px;
   height: 6px;
   border-radius: 50%;
   background: currentColor;
   animation: pulse 2s infinite;
  }

  @keyframes pulse {

   0%,
   100% {
    opacity: 1;
   }

   50% {
    opacity: 0.5;
   }
  }

  /* QUICK LINKS */
  .quick-links {
   display: flex;
   gap: 32px;
   margin-top: 8px;
  }

  .nav-link {
   font-size: 12px;
   font-weight: 600;
   color: var(--text-tertiary);
   text-decoration: none;
   text-transform: uppercase;
   letter-spacing: 1px;
   padding: 12px 24px;
   border-radius: 8px;
   transition: all 0.2s ease;
   border: 1px solid transparent;
  }

  .nav-link:hover {
   color: var(--text-primary);
   background: rgba(255, 255, 255, 0.03);
   border-color: rgba(255, 255, 255, 0.08);
  }

  /* FOOTER */
  .launcher-footer {
   position: fixed;
   bottom: 0;
   left: 0;
   right: 0;
   text-align: center;
   font-size: 10px;
   color: var(--text-tertiary);
   padding: 16px;
   opacity: 0.5;
  }
 </style>
</head>

<body class="app-shell admin-shell launcher-page" data-allowed-roles="admin">

 <!-- TOPBAR (Same as admin-central-stock) -->
 <header class="topbar">
  <!-- Left: Breadcrumb -->
  <nav class="breadcrumb topbar-start">
   <span class="breadcrumb-item current">ADMINISTRACIÓN</span>
  </nav>

  <!-- Center: Workday Status -->
  <div class="topbar-center">
   <div id="workday-status" class="workday-status status-closed">
    <span class="workday-dot"></span>
    <span id="workday-text">Cargando...</span>
   </div>
  </div>

  <!-- Right: Notifications + Avatar -->
  <div class="topbar-end">
   <!-- Notifications Dropdown -->
   <div class="dropdown-container">
    <button id="btn-notifications" class="icon-btn" aria-label="Notificaciones">
     <svg class="icon-notification" viewBox="0 0 24 24">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
     </svg>
    </button>
   </div>

   <!-- User Menu Dropdown -->
   <div class="dropdown-container">
    <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">...</button>
    <div class="dropdown-menu dropdown-user hidden" id="user-menu">
     <div class="dropdown-header" id="user-name-display">Usuario</div>
     <div class="dropdown-divider"></div>
     <a href="./admin-config.html" class="dropdown-item">
      <svg class="dropdown-icon" viewBox="0 0 24 24">
       <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
       <circle cx="12" cy="7" r="4"></circle>
      </svg>
      Perfil
     </a>
     <div class="dropdown-divider"></div>
     <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
      <svg class="dropdown-icon" viewBox="0 0 24 24">
       <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
       <polyline points="16 17 21 12 16 7"></polyline>
       <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Cerrar Sesión
     </a>
    </div>
   </div>
  </div>
 </header>

 <!-- CENTER CONTENT -->
 <main class="launcher-center">
  <h1 class="main-title">MIDNIGHT CLUB</h1>

  <!-- Search Bar -->
  <div class="header-search" style="width: 100%; max-width: 400px; margin: 8px 0;">
   <input type="text" id="global-search" class="input" placeholder="Buscar..." style="width: 100%; padding-left: 36px;">
   <svg class="header-search-icon" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
   </svg>
  </div>

  <nav class="quick-links">
   <a href="admin-workdays.html" class="nav-link">Workdays</a>
   <a href="admin-central-stock.html" class="nav-link">Stock Central</a>
   <a href="admin-pagos.html" class="nav-link">Payments</a>
  </nav>
 </main>

 <!-- FOOTER -->
 <footer class="launcher-footer">
  &copy; 2026 Midnight Systems
 </footer>

 <!-- Core Scripts -->
 <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
 <script defer src="../../assets/js/core/config.js"></script>
 <script defer src="../../assets/js/core/supabase-client.js"></script>
 <script defer src="../../assets/js/core/utils.js"></script>
 <script defer src="../../assets/js/core/auth.js"></script>
 <script defer src="../../assets/js/core/toast.js"></script>
 <script defer src="../../assets/js/core/work-day-helper.js"></script>
 <script src="../../assets/js/core/navigation.js"></script>

 <script>
  (async function () {
   'use strict';

   // Auth Guard
   const session = await window.Auth.guardOrRedirect(['admin']);
   if (!session) return;

   const avatar = document.getElementById('user-avatar');
   const userNameDisplay = document.getElementById('user-name-display');
   const userMenu = document.getElementById('user-menu');
   const workdayStatus = document.getElementById('workday-status');
   const workdayText = document.getElementById('workday-text');
   const logoutBtn = document.getElementById('btn-logout');

   // 1. Set user info
   const user = session.user;
   const meta = user.user_metadata || {};
   const fullName = meta.full_name || meta.name || user.email || '';
   const initials = fullName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2) || 'U';
   avatar.textContent = initials;
   userNameDisplay.textContent = fullName || user.email;

   // 2. Load workday status
   try {
    const workday = await window.WorkDayHelper.getOpenWorkDay();
    if (workday) {
     const date = new Date(workday.work_date + 'T12:00:00');
     const dayName = date.toLocaleDateString('es-AR', { weekday: 'long' });
     const dayNum = date.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
     workdayText.textContent = `${dayName} ${dayNum}`;
     workdayStatus.classList.remove('status-closed', 'status-planning');
     workdayStatus.classList.add(workday.status === 'open' ? 'status-open' : 'status-planning');
    } else {
     workdayText.textContent = 'Sin jornada activa';
     workdayStatus.classList.remove('status-open', 'status-planning');
     workdayStatus.classList.add('status-closed');
    }
   } catch (err) {
    console.warn('WorkDay fetch error:', err);
    workdayText.textContent = 'Error';
   }

   // 3. Avatar Dropdown Toggle
   avatar.addEventListener('click', (e) => {
    e.stopPropagation();
    userMenu.classList.toggle('hidden');
   });

   document.addEventListener('click', () => {
    userMenu.classList.add('hidden');
   });

   // 4. Logout
   logoutBtn?.addEventListener('click', async (e) => {
    e.preventDefault();
    if (confirm('¿Cerrar sesión?')) {
     await window.Auth.logout();
    }
   });
  })();
 </script>

</body>

</html>
