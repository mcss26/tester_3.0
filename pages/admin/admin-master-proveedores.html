<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Proveedores - FormulaMid</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell admin-shell admin-scroll admin-proveedores" data-allowed-roles="admin,contable">
    <a href="#module-content" class="skip-link">Saltar al contenido principal</a>

    <header class="app-topbar">
        <div class="topbar-left">
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>
        <div class="topbar-right">
            <span class="area-brand">ADMIN</span>
        </div>
    </header>

    <main class="page-shell" role="main">
        <div class="page-card-wrap">
            <div class="page-card">
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-spinner" aria-hidden="true"></div>
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando proveedores...</p>
                        <p class="state-desc">Esto puede tardar unos segundos</p>
                    </div>
                </div>
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block">
                        <p class="state-title">Sin resultados</p>
                        <p class="state-desc">Prueba con otro término de búsqueda.</p>
                        <button class="btn-ghost btn-sm mt-2" id="btn-clear-search">Limpiar búsqueda y ver
                            todos</button>
                    </div>
                </div>
                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Gestión de proveedores</h2>
                                <p class="dashboard-subtitle dashboard-subtitle-soft">Listado y control de proveedores
                                    del sistema</p>
                            </div>
                            <button class="btn-icon btn-icon-flat btn-icon-plus" id="btn-new"
                                aria-label="Nuevo proveedor">+</button>
                        </div>

                        <div class="filter-bar filter-bar-compact" role="search" aria-label="Filtros de proveedores">
                            <div class="filter-group">
                                <button
                                    class="status-pill status-neutral topbar-pill topbar-pill-quiet filter-pill active"
                                    data-status="all" aria-label="Mostrar todos los proveedores">
                                    Total <span class="pill-count" id="providers-total">0</span>
                                </button>
                                <button class="status-pill status-success topbar-pill topbar-pill-quiet filter-pill"
                                    data-status="active" aria-label="Mostrar proveedores activos">
                                    Activos <span class="pill-count" id="providers-active">0</span>
                                </button>
                                <button class="status-pill status-error topbar-pill topbar-pill-quiet filter-pill"
                                    data-status="inactive" aria-label="Mostrar proveedores inactivos">
                                    Inactivos <span class="pill-count" id="providers-inactive">0</span>
                                </button>
                            </div>
                            <div class="filter-actions">
                                <input type="search" id="providers-search" class="input input-compact filter-input"
                                    placeholder="Buscar por nombre, CUIT o rubro..." aria-label="Buscar proveedor"
                                    autocomplete="off" />
                            </div>
                        </div>

                        <!-- List Container (Managed by JS) -->
                        <div class="staff-list" id="list-container">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Slide Panel -->
    <div class="panel-overlay" id="panel-overlay"></div>
    <div class="slide-panel" id="slide-panel">
        <div class="panel-header">
            <h3 class="panel-title" id="panel-title">Nuevo Proveedor</h3>
            <button class="panel-close" id="btn-close-panel" aria-label="Cerrar panel">×</button>
        </div>
        <div class="panel-body" id="panel-form-container">
            <div id="panel-error" class="panel-error"></div>

            <div class="form-group">
                <label for="prov-nombre" class="form-label">Nombre Fantasía *</label>
                <input type="text" id="prov-nombre" class="input" placeholder="Ej: Distribuidora Central" required>
            </div>

            <div class="form-group">
                <label for="prov-razon-social" class="form-label">Razón Social</label>
                <input type="text" id="prov-razon-social" class="input" placeholder="Ej: Distribuidora Central S.A.">
            </div>

            <div class="form-group">
                <label for="prov-cuit" class="form-label">CUIT</label>
                <input type="text" id="prov-cuit" class="input" placeholder="Ej: 30-12345678-9">
            </div>

            <div class="form-group">
                <label for="prov-category" class="form-label">Categoría/Rubro</label>
                <select id="prov-category" class="input">
                    <option value="">Seleccionar rubro</option>
                </select>
                <span class="note">Gestionar rubros desde Categorías.</span>
            </div>

            <div class="form-group">
                <label for="prov-telefono" class="form-label">Teléfono de contacto</label>
                <input type="text" id="prov-telefono" class="input" placeholder="Ej: +54 11 4444 5555">
            </div>

            <div class="form-group">
                <label for="prov-email" class="form-label">Email</label>
                <input type="email" id="prov-email" class="input" placeholder="contacto@proveedor.com">
            </div>

            <div class="form-group">
                <label for="prov-banco" class="form-label">Banco</label>
                <input type="text" id="prov-banco" class="input" placeholder="Ej: BBVA">
            </div>

            <div class="form-group">
                <label for="prov-cbu" class="form-label">CBU / Alias</label>
                <input type="text" id="prov-cbu" class="input" placeholder="Alias o CBU">
            </div>

            <div class="form-group">
                <label for="prov-contacto-nombre" class="form-label">Nombre de contacto</label>
                <input type="text" id="prov-contacto-nombre" class="input" placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label for="prov-notas" class="form-label">Notas</label>
                <textarea id="prov-notas" class="input" rows="3" placeholder="Información adicional..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="prov-active">Estado</label>
                <label class="checkbox-row">
                    <input type="checkbox" id="prov-active" checked>
                    <span>Activo</span>
                </label>
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn btn-secondary" id="btn-cancel">Cancelar</button>
            <button class="btn btn-primary" id="btn-save">Guardar</button>
        </div>
    </div>
    <!-- Scripts -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <!-- Page Specific Script -->
    <!-- Shared Panel Logic -->
    <script defer src="../../assets/js/modules/panel.js"></script>
    <!-- Page Specific Script -->
    <script defer src="../../assets/js/modules/admin/admin-master-proveedores.js"></script>

    <!-- Shared Navigation Script -->
    <script src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/core/breadcrumbs.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('breadcrumbs');
            if (container && window.Breadcrumbs) {
                window.Breadcrumbs.render(container);
            }
        });
    </script>
</body>

</html>
