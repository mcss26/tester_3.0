<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes de Stock - Admin</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell admin-shell admin-scroll admin-ajustes" data-allowed-roles="admin,contable,logistico">

    <header class="app-topbar">
        <div class="topbar-left">
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>

        <nav class="topbar-center topbar-nav-split">
            <div class="topbar-nav-group left">
                <button class="topbar-link is-fade-1" data-go="pages/admin/admin-stock.html">Stock</button>
            </div>
            <div class="topbar-nav-group center">
                <button class="topbar-link is-center active"
                    data-go="pages/admin/admin-stock-ajustes.html">Ajustes</button>
            </div>
            <div class="topbar-nav-group right">
                <button class="topbar-link is-fade-1" data-go="pages/admin/admin-solicitudes.html">Solicitudes</button>
                <button class="topbar-link is-fade-2" data-go="pages/admin/admin-herramientas.html">Análisis</button>
            </div>
        </nav>

        <div class="topbar-right">
            <span class="system-status-pill status-open topbar-pill topbar-pill-quiet">ESTADO: OK</span>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <!-- Loading State -->
                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-spinner" aria-hidden="true"></div>
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando productos...</p>
                        <p class="state-desc">Esto puede tardar unos segundos</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block">
                        <p class="state-title">No hay productos</p>
                        <p class="state-subtitle">No se pudo cargar el inventario.</p>
                    </div>
                </div>

                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Ajuste Manual de Inventario</h2>
                                <p class="dashboard-subtitle dashboard-subtitle-soft">Registrar pérdidas, consumos o
                                    correcciones.</p>
                            </div>
                        </div>

                        <form id="adjustment-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label" for="select-sku">Producto (SKU)</label>
                                    <select id="select-sku" class="item-supplier-select">
                                        <option value="">Cargando productos...</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <div class="staff-row">
                                        <span class="muted">Stock Actual</span>
                                        <span id="current-stock-display" class="cell-stronger">-</span>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Tipo de Movimiento</label>
                                <div class="tab-bar">
                                    <button type="button" class="tab-chip type-btn active"
                                        data-type="consumption">Consumo / Merma</button>
                                    <button type="button" class="tab-chip type-btn" data-type="adjustment">Corrección
                                        (Audit)</button>
                                </div>
                                <input type="hidden" id="input-type" value="consumption">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="input-qty">Cantidad a Descontar</label>
                                <input type="number" id="input-qty" class="input-full" min="1" value="1">
                                <div class="faint" id="qty-hint">(-1 UN)</div>
                                <p class="faint">* Para agregar stock use Recepción de Mercadería</p>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="input-reason">Motivo / Notas</label>
                                <input type="text" id="input-reason" class="input-full"
                                    placeholder="Ej: Botella rota, Degustación...">
                            </div>

                            <button type="submit" class="btn-danger" style="width:100%">Confirmar Ajuste</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>



    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/constants.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>

    <!-- Navigation Core -->
    <script defer src="../../assets/js/core/navigation-state.js"></script>
    <script defer src="../../assets/js/core/navigation-analytics.js"></script>
    <script defer src="../../assets/js/core/navigation-history.js"></script>
    <script defer src="../../assets/js/core/keyboard-nav.js"></script>
    <script defer src="../../assets/js/core/navigation-debug.js"></script>
    <script defer src="../../assets/js/core/breadcrumbs.js"></script>

    <script src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/modules/admin/admin-stock-ajustes.js"></script>

    <script>
        // Auto-render breadcrumbs
        const breadcrumbContainer = document.getElementById("breadcrumbs");
        if (breadcrumbContainer && window.Breadcrumbs) {
            window.Breadcrumbs.render(breadcrumbContainer);
        }
    </script>
</body>

</html>
