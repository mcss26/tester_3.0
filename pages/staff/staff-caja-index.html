<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja - Midnight Club</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="welcome-screen staff-landing" data-allowed-roles="staff_caja,admin,operativo">

    <main class="center-content">

        <!-- Welcome Section -->
        <section class="welcome-section">
            <p class="label-welcome">BIENVENIDO STAFF</p>
            <h1 id="user-name" class="title-name">Cargando...</h1>
            <p class="role-subtitle" id="role-subtitle">STAFF <strong>CAJA</strong></p>
        </section>

        <!-- Operational Content -->
        <section class="action-section container-narrow">

            <!-- Status Alert -->
            <div id="status-message" class="alert hidden text-center text-sm font-bold"
                style="margin-bottom: var(--space-md);"></div>

            <!-- Convocation Alert Card -->
            <div id="convocation-card" class="action-card hidden col-flex cursor-default p-6"
                style="margin-bottom: var(--space-md);">
                <div class="status-pill status-success text-sm font-bold tracking-wider"
                    style="margin-bottom: var(--space-sm);">
                    CONVOCATORIA CONFIRMADA
                </div>

                <h3 class="text-2xl font-bold" style="margin-bottom: var(--space-xs);" id="convocation-date">...</h3>
                <p class="faint text-sm" style="margin-bottom: var(--space-md);" id="convocation-role">...</p>

                <button id="btn-confirm-convocation" class="btn btn-primary w-full">
                    CONFIRMAR ASISTENCIA
                </button>
            </div>

            <!-- Step Dashboard: Active Assignment -->
            <div id="step-dashboard" class="hidden animate-fade-in">

                <!-- Info Card -->
                <div class="action-card cursor-default flex-col items-start !text-left p-5 w-full"
                    style="margin-bottom: var(--space-md);">
                    <div class="flex-between align-center w-full" style="margin-bottom: var(--space-xs);">
                        <div class="row-flex align-center gap-sm">
                            <div class="icon-box">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                            </div>
                            <span class="text-lg font-bold" id="active-terminal-name">Cargando...</span>
                        </div>
                        <div id="terminal-status-pill" class="status-pill status-active">ASIGNADO</div>
                    </div>

                    <!-- Timeline -->
                    <div id="status-timeline" class="status-timeline" style="margin-top: var(--space-sm);">
                        <div class="timeline-step" data-step="waiting">
                            <div class="timeline-dot"></div>
                            <span class="timeline-label">Esperando</span>
                        </div>
                        <div class="timeline-connector"></div>
                        <div class="timeline-step" data-step="assigned">
                            <div class="timeline-dot"></div>
                            <span class="timeline-label">Asignado</span>
                        </div>
                        <div class="timeline-connector"></div>
                        <div class="timeline-step" data-step="submitted">
                            <div class="timeline-dot"></div>
                            <span class="timeline-label">Declarado</span>
                        </div>
                        <div class="timeline-connector"></div>
                        <div class="timeline-step" data-step="verified">
                            <div class="timeline-dot"></div>
                            <span class="timeline-label">Verificado</span>
                        </div>
                    </div>
                </div>

                <!-- Closing Form -->
                <form id="closing-form" class="w-full">
                    <p class="label-welcome text-center" style="margin-bottom: var(--space-md);">Declaración</p>

                    <div class="card-section">
                        <label for="input-cash" class="block text-sm uppercase faint mb-1">Total Efectivo</label>
                        <div class="input-group">
                            <span class="input-prefix">$</span>
                            <input type="number" id="input-cash" class="input text-lg font-mono" placeholder="0.00"
                                step="0.01" required>
                        </div>
                    </div>

                    <div class="card-section">
                        <label for="input-zoco" class="block text-sm uppercase faint mb-1">Total Zoco / QR</label>
                        <div class="input-group">
                            <span class="input-prefix">$</span>
                            <input type="number" id="input-zoco" class="input text-lg font-mono" placeholder="0.00"
                                step="0.01" required>
                        </div>
                    </div>

                    <div class="card-section">
                        <label class="block text-sm uppercase faint mb-2">Firma Digital</label>
                        <div class="signature-wrapper relative border border-white/10 rounded-lg bg-black/20 overflow-hidden"
                            style="height: 160px; touch-action: none;">
                            <canvas id="signature-canvas" class="w-full h-full cursor-crosshair"></canvas>
                            <div id="signature-placeholder"
                                class="signature-placeholder absolute inset-0 flex items-center justify-center text-white/20 pointer-events-none">
                                Firmar aquí
                            </div>
                            <button type="button" id="btn-clear-signature"
                                class="absolute top-2 right-2 btn-icon btn-ghost btn-sm" title="Borrar firma">✗</button>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-close"
                        class="btn btn-primary w-full py-4 text-sm tracking-widest mt-4">
                        CERRAR TURNO
                    </button>
                </form>
            </div>

        </section>

    </main>
    <!-- Scripts -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>

    <!-- App Logic -->
    <script defer src="../../assets/js/modules/staff/staff-caja-index.js"></script>
    <footer class="footer">
        <button id="btn-logout" class="footer-link">Cerrar Sesión</button>
    </footer>

</body>

</html>
