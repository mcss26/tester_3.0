<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co https://cdn.jsdelivr.net;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="Terminal de caja — punto de venta y registro de transacciones"
    />
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Staff Caja — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
    <link rel="stylesheet" href="../../assets/css/admin-central-stock.css">
    <link rel="stylesheet" href="../../assets/css/staff-caja.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="staff_caja,admin,operativo">

    <!-- TOPBAR (Golden Standard) -->
    <header class="topbar">
        <!-- Left: Breadcrumb -->
        <nav class="breadcrumb topbar-start" aria-label="Navegación">
            <span class="breadcrumb-item current">STAFF CAJA</span>
        </nav>

        <!-- Center: Workday Status -->
        <div class="topbar-center">
            <div id="workday-status" class="workday-status status-closed">
                <span class="workday-dot"></span>
                <span id="workday-text">Cargando...</span>
            </div>
        </div>

        <!-- Right: Avatar + Dropdown -->
        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">...</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Usuario</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content (operational — preserved) -->
    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <!-- Dashboard Header -->
                <header class="dashboard-header">
                    <h2 class="dashboard-title dashboard-title-soft">Staff Caja</h2>
                    <p class="dashboard-subtitle-soft">Panel de declaración y cierre de turno</p>
                </header>

                <section class="action-section container-narrow">

                    <!-- Status Alert -->
                    <div id="status-message" class="alert hidden text-center text-sm font-bold mb-md"></div>

                    <!-- Convocation Alert Card -->
                    <div id="convocation-card" class="action-card hidden col-flex cursor-default p-6 mb-md">
                        <div class="status-pill status-success text-sm font-bold tracking-wider mb-sm">
                            CONVOCATORIA CONFIRMADA
                        </div>

                        <h3 class="text-2xl font-bold mb-xs" id="convocation-date">...
                        </h3>
                        <p class="faint text-sm mb-md" id="convocation-role">...</p>

                        <button id="btn-confirm-convocation" class="btn btn-primary w-full">
                            CONFIRMAR ASISTENCIA
                        </button>
                    </div>

                    <!-- Step Dashboard: Active Assignment -->
                    <div id="step-dashboard" class="hidden animate-fade-in">

                        <!-- Info Card -->
                        <div class="action-card cursor-default flex-col items-start !text-left p-5 w-full mb-md">
                            <div class="flex-between align-center w-full mb-xs">
                                <div class="row-flex align-center gap-sm">
                                    <div class="icon-box">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                            <line x1="8" y1="21" x2="16" y2="21"></line>
                                            <line x1="12" y1="17" x2="12" y2="21"></line>
                                        </svg>
                                    </div>
                                    <span class="text-lg font-bold" id="active-terminal-name">Cargando...</span>
                                </div>
                                <div id="terminal-status-pill" class="status-pill status-active">ASIGNADO</div>
                            </div>

                            <!-- Timeline -->
                            <div id="status-timeline" class="status-timeline mt-sm">
                                <div class="timeline-step" data-step="waiting">
                                    <div class="timeline-dot"></div>
                                    <span class="timeline-label">Esperando</span>
                                </div>
                                <div class="timeline-connector"></div>
                                <div class="timeline-step" data-step="assigned">
                                    <div class="timeline-dot"></div>
                                    <span class="timeline-label">Asignado</span>
                                </div>
                                <div class="timeline-connector"></div>
                                <div class="timeline-step" data-step="submitted">
                                    <div class="timeline-dot"></div>
                                    <span class="timeline-label">Declarado</span>
                                </div>
                                <div class="timeline-connector"></div>
                                <div class="timeline-step" data-step="verified">
                                    <div class="timeline-dot"></div>
                                    <span class="timeline-label">Verificado</span>
                                </div>
                            </div>
                        </div>

                        <!-- Closing Form -->
                        <form id="closing-form" class="w-full">
                            <p class="label-welcome text-center mb-md">Declaración</p>

                            <div class="card-section form-group">
                                <label for="input-cash" class="form-label">Total Efectivo</label>
                                <div class="input-group">
                                    <span class="input-prefix">$</span>
                                    <input type="number" id="input-cash" class="input text-lg font-mono"
                                        placeholder="0.00" step="0.01" required aria-label="Monto total en efectivo">
                                </div>
                            </div>

                            <div class="card-section form-group">
                                <label for="input-zoco" class="form-label">Total Zoco / QR</label>
                                <div class="input-group">
                                    <span class="input-prefix">$</span>
                                    <input type="number" id="input-zoco" class="input text-lg font-mono"
                                        placeholder="0.00" step="0.01" required aria-label="Monto total Zoco o QR">
                                </div>
                            </div>

                            <div class="card-section form-group">
                                <label class="form-label">Firma Digital</label>
                                <div
                                    class="signature-wrapper relative border border-white/10 rounded-lg bg-black/20 overflow-hidden signature-canvas-height">
                                    <canvas id="signature-canvas" class="w-full h-full cursor-crosshair"></canvas>
                                    <div id="signature-placeholder"
                                        class="signature-placeholder absolute inset-0 flex items-center justify-center text-white/20 pointer-events-none">
                                        Firmar aquí
                                    </div>
                                    <button type="button" id="btn-clear-signature"
                                        class="absolute top-2 right-2 btn-icon btn-ghost btn-sm" title="Borrar firma"
                                        aria-label="Borrar firma">?</button>
                                </div>
                            </div>

                            <button type="submit" id="btn-submit-close"
                                class="btn btn-primary w-full py-4 text-sm tracking-widest mt-4"
                                aria-label="Cerrar turno y enviar declaración">
                                CERRAR TURNO
                            </button>
                        </form>
                    </div>

                </section>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/work-day-helper.js"></script>
    <script src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/modules/staff/staff-caja-index.js"></script>

    <script defer src="../../assets/js/core/topbar.js"></script>
  </body>

</html>
