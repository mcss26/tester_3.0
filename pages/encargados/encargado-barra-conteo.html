<!DOCTYPE html>
<html lang="es">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Encargado Barra - Conteo de Mercadería</title>
 <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-shell stock-shell" data-allowed-roles="encargado_barra,admin">

 <header class="app-topbar">
  <div class="topbar-left">
   <button class="topbar-link" data-go="pages/encargados/encargado-barra-index.html">← Volver</button>
  </div>

  <nav class="topbar-center">
   <button class="topbar-link active">Conteo</button>
  </nav>

  <div class="topbar-right">
   <div class="topbar-brand">BARRA</div>
  </div>
 </header>

 <!-- Loading State -->
 <div id="page-card-loading" class="page-card-loading">
  <div class="loading-content">
   <div class="loading-spinner"></div>
   <h3 class="loading-title">Cargando Recepciones...</h3>
   <p class="loading-msg">Sincronizando mercadería pendiente de conteo...</p>
  </div>
 </div>

 <!-- Empty State -->
 <div id="page-card-empty" class="page-card-empty hidden">
  <div class="empty-content">
   <div class="empty-icon">📋</div>
   <h3 class="empty-title">Sin Conteos Pendientes</h3>
   <p class="empty-msg">No hay recepciones pendientes de conteo de mercadería.</p>
   <button class="btn btn-primary btn-sm mt-4" onclick="location.reload()">Refrescar</button>
  </div>
 </div>

 <main class="page-shell">
  <div id="module-content" class="page-card-wrap hidden">
   <div class="page-card">

    <div class="staff-dashboard">
     <div class="dashboard-header">
      <div>
       <h2 class="dashboard-title">Conteo de Mercadería</h2>
       <p class="dashboard-subtitle">Validar cantidades recibidas vs. facturadas</p>
      </div>
      <div class="header-actions">
       <button class="btn-icon btn-icon-flat" id="btn-refresh" title="Refrescar">↻</button>
      </div>
     </div>

     <div class="tabs-row">
      <div id="status-tabs" class="tab-bar">
       <button class="tab-chip status-tab active" data-status="pending">Pendientes</button>
       <button class="tab-chip status-tab" data-status="counted">Contados</button>
       <button class="tab-chip status-tab" data-status="discrepancy">Con Discrepancia</button>
      </div>
     </div>

     <div class="staff-list table-viewport" id="list-container">
      <!-- contenido por JS -->
     </div>
    </div>
   </div>
  </div>
 </main>

 <!-- Modal de Conteo -->
 <div class="modal-overlay hidden" id="modal-count">
  <div class="modal-card">
   <div class="modal-header">
    <h2 id="modal-title">Conteo de Recepción</h2>
    <button class="btn-icon" id="close-modal">✕</button>
   </div>
   <div class="modal-body">
    <div class="mb-4 info-block" id="receipt-info">
     <!-- Injected by JS -->
    </div>

    <div class="table-scroll" id="count-items-container">
     <!-- items por JS -->
    </div>

    <div class="form-group mt-4">
     <label>Notas de Conteo</label>
     <textarea id="count-notes" class="input" rows="2"
      placeholder="Observaciones del conteo (ej: diferencias, productos dañados)..."></textarea>
    </div>
   </div>
   <div class="modal-footer">
    <button class="btn btn-ghost" id="btn-cancel-count">Cancelar</button>
    <button class="btn btn-primary" id="btn-confirm-count">Confirmar Conteo</button>
   </div>
  </div>
 </div>

 <!-- Scripts -->
 <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
 <script defer src="../../assets/js/core/config.js"></script>
 <script defer src="../../assets/js/core/supabase-client.js"></script>
 <script defer src="../../assets/js/core/auth.js"></script>
 <script defer src="../../assets/js/core/utils.js"></script>
 <script defer src="../../assets/js/core/toast.js"></script>
 <script defer src="../../assets/js/modules/encargados/encargado-barra-conteo.js"></script>
 <script src="../../assets/js/core/navigation.js"></script>
</body>

</html>
