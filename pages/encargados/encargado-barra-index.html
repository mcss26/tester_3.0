<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight - Encargado Barra</title>
    <!-- Estilo Base -->
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="welcome-screen encargado-landing" data-allowed-roles="encargado_barra">

    <main class="center-content">
        <section class="welcome-section">
            <p class="label-welcome">BIENVENIDO</p>
            <h1 id="user-name" class="title-name">...</h1>
            <p class="role-subtitle">Panel de <strong>ENCARGADO BARRA</strong></p>
            <p id="system-status" class="system-status-pill">...</p>
        </section>

        <section class="action-section">
            <div class="actions-grid">
                <button class="action-card" data-go="pages/encargados/encargado-recepcion.html" id="btn-recepcion">
                    <div class="card-content">
                        <span class="footer-link">RECEPCIÓN</span>
                    </div>
                    <span class="status-pill hidden" id="badge-recepcion">0</span>
                </button>

                <button class="action-card" data-go="pages/encargados/encargado-barra-conteo.html" id="btn-conteo">
                    <div class="card-content">
                        <span class="footer-link">CONTEO</span>
                    </div>
                    <span class="status-pill hidden" id="badge-conteo">0</span>
                </button>

                <button class="action-card is-disabled" aria-disabled="true" id="btn-personal">
                    <div class="card-content">
                        <span class="footer-link">PERSONAL</span>
                    </div>
                </button>

                <button class="action-card is-disabled" aria-disabled="true" id="btn-noche">
                    <div class="card-content">
                        <span class="footer-link">NOCHE</span>
                    </div>
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <button id="btn-logout" class="footer-link">Cerrar Sesión</button>
    </footer>

    <!-- Scripts -->
    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/work-day-helper.js"></script>
    <script src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/modules/encargados/encargado-barra-index.js"></script>

</body>

</html>
