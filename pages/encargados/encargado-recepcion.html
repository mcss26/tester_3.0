<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Recepción — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
</head>

<body class="app-shell" data-allowed-roles="encargado_barra,admin,contable">

    <header class="topbar">
        <div class="topbar-start">
            <button class="btn-icon btn-icon-flat" data-go="pages/encargados/encargado-barra-index.html"
                aria-label="Volver a Inicio">←</button>
            <nav class="breadcrumb" aria-label="Navegación">
                <span class="breadcrumb-item"><a class="breadcrumb-link"
                        href="encargado-barra-index.html">BARRA</a></span>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-item current">RECEPCIÓN</span>
            </nav>
        </div>
        <div class="topbar-center">
            <span class="topbar-title">RECEPCIÓN</span>
        </div>
        <div class="topbar-end">
            <button id="btn-refresh" class="btn-icon btn-icon-flat" aria-label="Refrescar">↻</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="page-shell">
        <div class="page-card-wrap">

            <!-- Loading State -->
            <div class="page-card-loading" id="pageLoading">
                <div class="loading-spinner"></div>
                <span>Cargando pedidos...</span>
            </div>

            <!-- Empty State -->
            <div class="page-card-empty hidden" id="pageEmpty">
                <p>No hay pedidos pendientes de recepción.</p>
            </div>

            <!-- Orders Table -->
            <div class="page-content hidden" id="pageContent">
                <div class="table-viewport table-shell" id="list-container">
                    <div class="table-scroll">
                        <table class="table table-sticky table-compact">
                            <thead>
                                <tr class="table-head">
                                    <th class="table-cell is-header cell-pad">Proveedor</th>
                                    <th class="table-cell is-header cell-pad text-center">SKUs</th>
                                    <th class="table-cell is-header cell-pad text-right">Costo Total</th>
                                    <th class="table-cell is-header cell-pad text-center">ETA</th>
                                    <th class="table-cell is-header cell-pad text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="orders-body">
                                <!-- JS Injected -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Reception Modal (Native Dialog) -->
    <dialog class="modal" id="modal">
        <div class="modal-content modal-content-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Recibir Pedido</h3>
                <button class="modal-close" id="modal-close" aria-label="Cerrar modal">×</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Items table injected by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-cancel">Cancelar</button>
                <button class="btn-primary" id="modal-confirm">Confirmar Recepción</button>
            </div>
        </div>
    </dialog>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/work-day-helper.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/modules/encargados/encargado-recepcion.js"></script>

</body>

</html>
