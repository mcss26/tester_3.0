<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Operaciones — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/admin-central-stock.css">
    <link rel="stylesheet" href="../../assets/css/launcher.css">
</head>

<body class="app-shell admin-shell launcher-page"
    data-allowed-roles="operativo,staff_barra,staff_operativo,admin,encargado_barra,encargado_caja">

    <!-- TOPBAR -->
    <header class="topbar">
        <!-- Left: Breadcrumb -->
        <nav class="breadcrumb topbar-start">
            <span class="breadcrumb-item current">OPERACIONES</span>
        </nav>

        <!-- Center: Workday Status -->
        <div class="topbar-center">
            <div id="workday-status" class="workday-status status-closed">
                <span class="workday-dot"></span>
                <span id="workday-text">Cargando...</span>
            </div>
        </div>

        <!-- Right: Avatar -->
        <div class="topbar-end">
            <!-- MCO Widget -->
            <div class="status-indicator status-active hidden" id="mco-widget">
                <span class="status-dot"></span>
                <span class="status-text">MCO: <span id="mco-qr-validated">0</span></span>
            </div>

            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">OP</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Operativo</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- CENTER CONTENT -->
    <main class="launcher-center">
        <h1 class="launcher-title">OPERACIONES</h1>

        <!-- Search Bar -->
        <div class="search-wrapper">
            <input type="text" id="global-search" class="search-input" placeholder="Buscar..."
                aria-label="Navegación rápida">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <nav class="main-nav">
            <a href="operativo-workday.html" class="nav-link">Work Day</a>
            <a href="operativo-stock.html" class="nav-link">Stock</a>
            <a href="operativo-solicitudes.html" class="nav-link">Solicitudes</a>
            <a href="cms-members.html" class="nav-link">CMS Members</a>
            <a href="operativo-master-sku.html" class="nav-link">Configuración</a>
        </nav>
    </main>

    <!-- FOOTER -->
    <footer class="launcher-footer">
        &copy; 2026 Midnight Systems
    </footer>

    <!-- Core Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/work-day-helper.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/modules/operativo/operativo-index.js"></script>
</body>

</html>
