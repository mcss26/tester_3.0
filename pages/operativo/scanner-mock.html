<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co https://cdn.jsdelivr.net;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
  <meta name="theme-color" content="#000000">
  <!-- NOTE: apple-mobile-web-app-capable removed — breaks camera in PWA mode on iOS -->
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <title>Scanner QR — Cuenta</title>

  <link rel="stylesheet" href="../../assets/css/tokens.css">

  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --text: #f5f5f5;
      --text-dim: rgba(255, 255, 255, 0.4);
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── HEADER: compact ── */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--card-border);
    }

    .hdr-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hdr h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .badge {
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hdr-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conn {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .conn.on {
      background: var(--green);
      box-shadow: 0 0 5px var(--green);
    }

    .conn.off {
      background: var(--red);
      box-shadow: 0 0 5px var(--red);
    }

    .conn.load {
      background: var(--yellow);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.3;
      }
    }

    .preload-txt {
      font-size: 8px;
      color: var(--text-dim);
      max-width: 80px;
      text-align: right;
      line-height: 1.1;
    }

    .btn-sm {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      min-height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-sm:active {
      opacity: 0.6;
    }

    /* ── COUNTER ── */
    .counter {
      text-align: center;
      padding: 6px 16px;
      flex-shrink: 0;
    }

    .counter-num {
      font-size: clamp(44px, 14vw, 72px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease;
    }

    .counter-num.bump {
      transform: scale(1.08);
    }

    .counter-lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    /* ── STATS ── */
    .stats {
      display: flex;
      gap: 6px;
      justify-content: center;
      padding: 0 16px 6px;
      flex-shrink: 0;
    }

    .st {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 5px;
    }

    .st b {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .st small {
      font-size: 8px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
    }

    .st.dup {
      border-color: rgba(234, 179, 8, 0.3);
    }

    .st.dup b {
      color: var(--yellow);
    }

    .st.inv {
      border-color: rgba(239, 68, 68, 0.3);
    }

    .st.inv b {
      color: var(--red);
    }

    /* ── CAMERA ── */
    .cam-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 12px;
      position: relative;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      overflow: hidden;
    }

    #reader video {
      border-radius: 10px;
    }

    /* html5-qrcode inserts extra elements - tame them */
    #reader img[alt="Info icon"] {
      display: none !important;
    }

    #reader>div:last-child {
      display: none !important;
    }

    /* hides "Powered by" text */

    /* ── LAST SCAN ── */
    .last {
      padding: 6px 12px;
      text-align: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .last.ok {
      color: var(--green);
    }

    .last.fail {
      color: var(--red);
    }

    .last.dup {
      color: var(--yellow);
    }

    /* ── BOTTOM BAR: input + torch ── */
    .bottom-bar {
      display: flex;
      gap: 6px;
      padding: 6px 12px 8px;
      flex-shrink: 0;
      align-items: center;
    }

    .bottom-bar input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      min-height: 44px;
    }

    .bottom-bar .btn-ok {
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 14px;
      min-height: 44px;
      min-width: 48px;
    }

    .bottom-bar .btn-ok:active {
      transform: scale(0.95);
    }

    .btn-torch {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-torch.active {
      background: rgba(234, 179, 8, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    /* ── HISTORY ── */
    .hist-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: none;
      background: none;
      width: 100%;
      min-height: 28px;
    }

    .hist-toggle .arr {
      transition: transform 0.2s;
      display: inline-block;
    }

    .hist-toggle.open .arr {
      transform: rotate(180deg);
    }

    .hist-list {
      padding: 0 12px;
      max-height: 0;
      overflow-y: auto;
      transition: max-height 0.3s ease;
      flex-shrink: 0;
    }

    .hist-list.open {
      max-height: 140px;
      padding-bottom: 8px;
    }

    .hist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--card-border);
      font-size: 10px;
    }

    .hist-item .code {
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .hist-item .result {
      font-weight: 700;
    }

    .hist-item .result.ok {
      color: var(--green);
    }

    .hist-item .result.fail {
      color: var(--red);
    }

    .hist-item .result.dup {
      color: var(--yellow);
    }

    .hist-item .time {
      color: rgba(255, 255, 255, 0.2);
    }

    /* ── OVERLAY ── */
    .ov {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ov.hidden {
      display: none;
    }

    .ov.success {
      background: rgba(34, 197, 94, 0.95);
    }

    .ov.error {
      background: rgba(239, 68, 68, 0.95);
    }

    .ov.warning {
      background: rgba(234, 179, 8, 0.95);
    }

    .ov-c {
      text-align: center;
      color: #fff;
      animation: pop 0.2s ease-out;
    }

    .ov-c .icon {
      font-size: 52px;
      margin-bottom: 6px;
    }

    .ov-c h2 {
      font-size: 24px;
      font-weight: 800;
    }

    .ov-c p {
      font-size: 14px;
      opacity: 0.9;
    }

    @keyframes pop {
      0% {
        transform: scale(0.85);
        opacity: 0;
      }

      60% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ── Safe area ── */
    @supports (padding: env(safe-area-inset-top)) {
      .hdr {
        padding-top: calc(8px + env(safe-area-inset-top));
      }

      .hist-list {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }

    /* ── Landscape optimization ── */
    @media (orientation: landscape) and (max-height: 500px) {
      .counter {
        padding: 2px 16px;
      }

      .counter-num {
        font-size: clamp(32px, 10vw, 48px);
      }

      .stats {
        padding: 0 16px 2px;
      }

      .cam-wrap {
        padding: 2px 12px;
      }
    }

    /* ── Export button ── */
    .btn-export {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
      min-height: 28px;
    }

    .hist-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <h1>SCANNER</h1>
      <span class="badge">CUENTA</span>
    </div>
    <div class="hdr-right">
      <span id="preloadStatus" class="preload-txt"></span>
      <div id="connStatus" class="conn"></div>
      <button id="btnReset" class="btn-sm" title="Reiniciar">↺</button>
    </div>
  </div>

  <!-- Counter -->
  <div class="counter">
    <div id="bigCount" class="counter-num">0</div>
    <div class="counter-lbl">Personas verificadas</div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="st"><small>OK</small><b id="statValid">0</b></div>
    <div class="st dup"><small>REP</small><b id="statDup">0</b></div>
    <div class="st inv"><small>INV</small><b id="statInvalid">0</b></div>
  </div>

  <!-- Camera -->
  <div class="cam-wrap">
    <div id="reader"></div>
  </div>

  <!-- Last scan -->
  <div id="lastScan" class="last">📷 Escaneá un QR</div>

  <!-- Bottom bar: input + torch -->
  <div class="bottom-bar">
    <input type="text" id="manualCode" placeholder="Código manual..." autocomplete="off" inputmode="text">
    <button id="btnManual" class="btn-ok">OK</button>
    <button id="btnTorch" class="btn-torch" title="Linterna">🔦</button>
  </div>

  <!-- History -->
  <div class="hist-bar">
    <button class="hist-toggle" id="historyToggle">Historial <span class="arr">▼</span></button>
    <button id="btnExport" class="btn-export" title="Exportar CSV">📥 CSV</button>
  </div>
  <div class="hist-list" id="historyList"></div>

  <!-- Overlay -->
  <div id="scanOverlay" class="ov hidden">
    <div class="ov-c">
      <div id="overlayIcon" class="icon">✓</div>
      <h2 id="overlayTitle">OK</h2>
      <p id="overlayMsg"></p>
    </div>
  </div>

  <!-- Audio -->
  <audio id="soundOk" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
  <audio id="soundNo" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>

  <!-- Scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="../../assets/js/core/config.js"></script>
  <script defer src="../../assets/js/core/supabase-client.js"></script>
  <script defer src="../../assets/js/modules/operativo/scanner-mock.js"></script>
    <script defer src="../../assets/js/core/topbar.js"></script>
  </body>

</html>
