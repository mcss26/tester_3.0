<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co https://cdn.jsdelivr.net;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Proveedores Op. — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
    <link rel="stylesheet" href="../../assets/css/admin-master.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="operativo,staff_barra,staff_operativo,admin">

    <!-- Topbar: Golden Standard -->
    <header class="topbar">
        <nav class="breadcrumb topbar-start" aria-label="Navegación">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="operativo-index.html">Operativo</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Proveedores</span>
        </nav>

        <div class="topbar-center header-search">
            <input type="text" id="global-search" class="input" placeholder="Ir a..." aria-label="Navegación rápida">
            <span class="header-shortcut">?K</span>
        </div>

        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">OP</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Usuario</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">




                <div class="page-card-loading" id="page-card-loading">
                    <div class="state-block loading">
                        <div class="state-loader"></div>
                        <p class="state-title">Cargando proveedores...</p>
                        <p class="state-desc">Sincronizando datos</p>
                    </div>
                </div>
                <div class="page-card-empty" id="page-card-empty">
                    <div class="state-block">
                        <p class="state-title">Sin resultados</p>
                        <p class="state-desc">No hay proveedores registrados.</p>
                    </div>
                </div>
                <div id="module-content">
                    <div class="staff-dashboard">
                        <div class="dashboard-header align-start">
                            <div>
                                <h2 class="dashboard-title dashboard-title-soft">Gestión de proveedores</h2>
                                <p class="dashboard-subtitle dashboard-subtitle-soft">Alta y edición de contactos de
                                    proveedor</p>
                            </div>
                            <button class="btn-icon btn-icon-flat btn-icon-plus" id="btn-new"
                                aria-label="Nuevo proveedor">+</button>
                        </div>

                        <!-- List Container (Managed by JS) -->
                        <div class="staff-list table-viewport table-shell" id="list-container">
                            <!-- Content injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Slide Panel -->
    <div class="panel-overlay" id="panel-overlay"></div>
    <div class="slide-panel" id="slide-panel">
        <div class="panel-header">
            <h3 class="panel-title" id="panel-title">Nuevo Proveedor</h3>
            <button class="panel-close" id="btn-close-panel" aria-label="Cerrar panel">—</button>
        </div>
        <div class="panel-body" id="panel-form-container">
            <div id="panel-error" class="panel-error"></div>

            <div class="form-group">
                <label for="prov-nombre" class="form-label">Nombre Fantas—a *</label>
                <input type="text" id="prov-nombre" class="input" placeholder="Ej: Distribuidora Central" required>
            </div>

            <div class="form-group">
                <label for="prov-razon-social" class="form-label">Raz—n Social</label>
                <input type="text" id="prov-razon-social" class="input" placeholder="Ej: Distribuidora Central S.A.">
            </div>

            <div class="form-group">
                <label for="prov-cuit" class="form-label">CUIT</label>
                <input type="text" id="prov-cuit" class="input" placeholder="Ej: 30-12345678-9">
            </div>

            <div class="form-group">
                <label for="prov-telefono" class="form-label">Tel—fono de contacto</label>
                <input type="text" id="prov-telefono" class="input" placeholder="Ej: +54 11 4444 5555">
            </div>

            <div class="form-group">
                <label for="prov-email" class="form-label">Email</label>
                <input type="email" id="prov-email" class="input" placeholder="contacto@proveedor.com">
            </div>

            <div class="form-group">
                <label for="prov-banco" class="form-label">Banco</label>
                <input type="text" id="prov-banco" class="input" placeholder="Ej: BBVA">
            </div>

            <div class="form-group">
                <label for="prov-cbu" class="form-label">CBU / Alias</label>
                <input type="text" id="prov-cbu" class="input" placeholder="Alias o CBU">
            </div>

            <div class="form-group">
                <label for="prov-contacto-nombre" class="form-label">Nombre de contacto</label>
                <input type="text" id="prov-contacto-nombre" class="input" placeholder="Ej: Juan P—rez">
            </div>

            <div class="form-group">
                <label for="prov-notas" class="form-label">Notas</label>
                <textarea id="prov-notas" class="input" rows="3" placeholder="Información adicional..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="prov-active">Estado</label>
                <label class="checkbox-row">
                    <input type="checkbox" id="prov-active" checked>
                    <span>Activo</span>
                </label>
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn btn-secondary" id="btn-cancel">Cancelar</button>
            <button class="btn btn-primary" id="btn-save">Guardar</button>
        </div>
    </div>
    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/panel.js"></script>
    <script defer src="../../assets/js/modules/operativo/operativo-master-proveedores.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
    <script defer src="../../assets/js/core/topbar.js"></script>
  </body>

</html>
