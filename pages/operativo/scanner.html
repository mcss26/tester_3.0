<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner QR - Midnight</title>

    <link rel="stylesheet" href="../../assets/css/main.css">

    <style>
        /* Stats Bar */
        .scanner-stats {
            justify-content: center;
        }

        .stat-chip {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .stat-chip.mco {
            border-color: #e4d2a8;
        }

        .stat-chip.mco .stat-value {
            color: #e4d2a8;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .stat-value {
            color: #fff;
            font-weight: 700;
            font-family: monospace;
            font-size: 14px;
        }

        /* Member Info */
        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e4d2a8 0%, #c9a96e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #000;
        }

        .member-name {
            font-size: 16px;
            font-weight: 600;
            color: #e4d2a8;
        }

        /* Fullscreen Overlay */
        .scan-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s, transform 0.3s;
        }

        .scan-overlay.hidden {
            display: none;
        }

        .scan-overlay.success {
            background: rgba(34, 197, 94, 0.95);
        }

        .scan-overlay.error {
            background: rgba(239, 68, 68, 0.95);
        }

        .scan-overlay.warning {
            background: rgba(234, 179, 8, 0.95);
        }

        .overlay-content {
            text-align: center;
            color: #fff;
            animation: pulse-in 0.3s ease-out;
        }

        .overlay-icon {
            font-size: 80px;
            margin-bottom: 16px;
        }

        .overlay-content h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .overlay-content p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* Animations */
        @keyframes pulse-in {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-8px);
            }

            40%,
            80% {
                transform: translateX(8px);
            }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Enhanced Status Card */
        .status-card.success {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
        }

        .status-card.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        .status-card.success .status-icon,
        .status-card.error .status-icon {
            font-size: 48px;
        }
    </style>

    <!-- Libraries -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>

<body class="qr-scanner" data-allowed-roles="admin,operativo,staff_guardia">

    <header
        class="row-flex flex-between align-center px-4 border-b border-white/10 bg-black/20 backdrop-blur-md sticky top-0 z-50 h-60px">
        <div class="user-info row-flex align-center gap-sm">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex-center text-xs font-bold" id="userAvatar">U</div>
            <div class="col-flex">
                <span id="userName" class="text-sm font-bold leading-tight">...</span>
                <span id="userRole" class="text-[10px] uppercase text-white/50 leading-tight">...</span>
            </div>
        </div>
        <button id="btnLogout" class="text-xs text-red-400 hover:text-red-300 uppercase font-bold">Salir</button>
    </header>

    <main class="flex-1 p-4 col-flex gap-md overflow-hidden">

        <!-- Stats Bar -->
        <div class="scanner-stats row-flex gap-sm text-xs">
            <div class="stat-chip"><span class="stat-label">TOTAL</span><span id="statTotal" class="stat-value">0</span>
            </div>
            <div class="stat-chip mco"><span class="stat-label">MCO</span><span id="statMco" class="stat-value">0</span>
            </div>
            <div class="stat-chip"><span class="stat-label">OTROS</span><span id="statOther" class="stat-value">0</span>
            </div>
        </div>

        <!-- Scanner Box -->
        <div class="scanner-section">
            <div id="reader" class="w-full h-full"></div>
            <div class="scanner-overlay">
                <div class="focus-box"></div>
            </div>
        </div>

        <!-- Status Card (Enhanced) -->
        <div id="statusCard" class="status-card idle">
            <div class="status-icon">📷</div>
            <div class="status-details">
                <h3 id="statusTitle">Listo</h3>
                <p id="statusMsg">Escaneá un código QR</p>
            </div>
            <!-- Member Info (Hidden by default) -->
            <div id="memberInfo" class="member-info hidden">
                <div id="memberAvatar" class="member-avatar">M</div>
                <span id="memberName" class="member-name">Miembro</span>
            </div>
        </div>

        <!-- Fullscreen Overlay for Success/Error -->
        <div id="scanOverlay" class="scan-overlay hidden">
            <div class="overlay-content">
                <div id="overlayIcon" class="overlay-icon">✓</div>
                <h2 id="overlayTitle">ACCESO OK</h2>
                <p id="overlayMsg">Bienvenido</p>
            </div>
        </div>

        <!-- Manual Input Toggle -->
        <div class="col-flex gap-sm">
            <button id="btnManualInput" class="w-full bg-white/10 text-white p-3 rounded-xl text-sm font-bold">Ingreso
                Manual</button>
            <div id="manualInputBox" class="hidden row-flex gap-sm">
                <input type="text" id="manualCode" placeholder="Código..."
                    class="bg-white/5 border border-white/10 rounded-xl p-3 flex-1 text-white outline-none focus:border-blue-500">
                <button id="btnCheckManual" class="bg-blue-600 text-white px-4 rounded-xl font-bold">OK</button>
            </div>
        </div>

        <!-- History -->
        <div class="history-section">
            <div class="section-header">
                <h3 class="text-sm font-bold text-white/70 uppercase">Recientes</h3>
                <span id="checkinCount" class="text-white font-mono">0</span>
            </div>
            <div id="historyList" class="history-list">
                <!-- Items -->
            </div>
        </div>

    </main>

    <!-- Audios -->
    <audio id="soundSuccess" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="soundError" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>

    <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/work-day-helper.js"></script>
    <script defer src="../../assets/js/modules/operativo/scanner.js"></script>
</body>

</html>
