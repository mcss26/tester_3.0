<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://iyknbgmcnbpvalvsjxjz.supabase.co;
      img-src 'self' data:;
      font-src 'self';
      frame-src 'none';">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Análisis — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/utilities.css">
    <link rel="stylesheet" href="../../assets/css/admin-master.css">
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="operativo,logistico,admin">

    <!-- Topbar: Golden Standard -->
    <header class="topbar">
        <nav class="breadcrumb topbar-start" aria-label="Navegación">
            <span class="breadcrumb-item">
                <a class="breadcrumb-link" href="operativo-index.html">Operativo</a>
            </span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item current">Análisis</span>
        </nav>

        <div class="topbar-center header-search">
            <input type="text" id="global-search" class="input" placeholder="Ir a..." aria-label="Navegación rápida">
            <span class="header-shortcut">⌘K</span>
        </div>

        <div class="topbar-end">
            <div class="dropdown-container">
                <button class="avatar avatar-sm" id="user-avatar" aria-label="Menú de usuario">OP</button>
                <div class="dropdown-menu dropdown-user hidden" id="user-menu">
                    <div class="dropdown-header" id="user-name-display">Usuario</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" id="btn-logout" class="dropdown-item dropdown-item-danger">
                        <svg class="dropdown-icon" viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">




                <div class="staff-dashboard">
                    <div class="dashboard-header align-start">
                        <div>
                            <h2 class="dashboard-title dashboard-title-soft">Análisis de Consumo</h2>
                            <p class="dashboard-subtitle-soft">Importación y cálculo de ideales</p>
                        </div>
                        <!-- Tab Bar in Header -->
                        <div class="actions-bar">
                            <div class="tab-bar" id="analysis-tabs-container">
                                <button class="tab-chip active">Importar</button>
                                <button type="button" class="tab-chip">Analizar</button>
                                <button type="button" class="tab-chip">Histórica</button>
                            </div>
                        </div>
                    </div>

                    <!-- TAB CONTENT: IMPORTAR -->
                    <div id="analysis-tab-importar" class="tab-content p-4">
                        <div class="form-group mb-4">
                            <label class="form-label" for="import-date">Fecha Operativa</label>
                            <input type="date" id="import-date" class="input input-compact">
                        </div>

                        <div class="file-drop-area mb-4">
                            <label for="import-file" class="btn btn-secondary">Seleccionar Excel (.xlsx)</label>
                            <input type="file" id="import-file" accept=".xlsx, .xls" hidden>
                            <span id="import-file-name" class="form-hint ml-2"></span>
                        </div>

                        <div id="import-preview" class="table-wrap">
                            <div class="empty-state">Seleccione un archivo para comenzar.</div>
                        </div>
                    </div>

                    <!-- TAB CONTENT: ANALIZAR -->
                    <div id="analysis-tab-analizar" class="tab-content hidden p-4">
                        <div class="dashboard-toolbar mb-4 gap-4">
                            <div class="form-group">
                                <label class="form-label fs-11" for="analyze-date-start">Desde</label>
                                <input type="date" id="analyze-date-start" class="input input-compact">
                            </div>
                            <div class="form-group">
                                <label class="form-label fs-11" for="analyze-date-end">Hasta</label>
                                <input type="date" id="analyze-date-end" class="input input-compact">
                            </div>
                            <button id="btn-analyze-ideal" class="btn btn-primary mt-auto">Calcular Ideales</button>
                        </div>

                        <div id="analysis-results" class="table-wrap">
                            <!-- Results here -->
                        </div>
                    </div>

                    <!-- TAB CONTENT: HISTORICA -->
                    <div id="analysis-tab-historica" class="tab-content hidden p-4">
                        <div class="chart-section">
                            <h3 class="chart-header">Tendencia Histórica</h3>
                            <canvas id="history-chart" class="chart-canvas-max"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/utils.js"></script>
    <script defer src="../../assets/js/core/toast.js"></script>
    <script defer src="../../assets/js/core/chart-loader.js"></script>
    <script defer src="../../assets/js/modules/operativo/operativo-analisis.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>

</body>

</html>
