<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <title>Análisis — Midnight</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/admin-master.css">
    <!-- SheetJS (Chart.js loaded lazily via chart-loader) -->
    <script src="../../assets/js/core/chart-loader.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>

<body class="app-shell admin-shell admin-scroll" data-allowed-roles="operativo,logistico">

    <header class="topbar">
        <div class="topbar-left">
            <button class="btn-icon btn-icon-flat" data-go="pages/operativo/operativo-erp.html"
                aria-label="Volver">←</button>
            <span class="topbar-back">ERP</span>
        </div>

        <nav class="topbar-center">
            <button class="topbar-link active" data-go="#">Cargar Consumo</button>
        </nav>

        <div class="topbar-right">
            <div class="topbar-brand">ERP</div>
        </div>
    </header>

    <main class="page-shell">
        <div class="page-card-wrap">
            <div class="page-card">

                <div class="staff-dashboard">
                    <div class="dashboard-header">
                        <div>
                            <h2 class="dashboard-title">Análisis de Consumo</h2>
                            <p class="dashboard-subtitle">Importación y cálculo de ideales</p>
                        </div>
                    </div>

                    <!-- TABS -->
                    <div class="tabs-row">
                        <div class="tab-bar" id="analysis-tabs-container">
                            <!-- Injected by JS -->
                            <button class="tab-chip active">Importar</button>
                            <button class="tab-chip">Analizar</button>
                            <button class="tab-chip">Histórica</button>
                        </div>
                    </div>

                    <!-- TAB CONTENT: IMPORTAR -->
                    <div id="analysis-tab-importar" class="p-4">
                        <div class="form-group mb-4">
                            <label class="form-label">Fecha Operativa</label>
                            <input type="date" id="import-date" class="input input-compact" style="width: 200px;">
                        </div>

                        <div class="file-drop-area mb-4">
                            <label for="import-file" class="btn-secondary">Seleccionar Excel (.xlsx)</label>
                            <input type="file" id="import-file" accept=".xlsx, .xls" hidden>
                            <span id="import-file-name" class="form-hint ml-2"></span>
                        </div>

                        <div id="import-preview" class="table-wrap">
                            <!-- Preview Table injected here -->
                            <div class="empty-state">Seleccione un archivo para comenzar.</div>
                        </div>
                    </div>

                    <!-- TAB CONTENT: ANALIZAR -->
                    <div id="analysis-tab-analizar" class="hidden p-4">
                        <div class="dashboard-toolbar mb-4 gap-4">
                            <div class="form-group">
                                <label class="form-label fs-11">Desde</label>
                                <input type="date" id="analyze-date-start" class="input input-compact">
                            </div>
                            <div class="form-group">
                                <label class="form-label fs-11">Hasta</label>
                                <input type="date" id="analyze-date-end" class="input input-compact">
                            </div>
                            <button id="btn-analyze-ideal" class="btn-primary mt-auto">Calcular
                                Ideales</button>
                        </div>

                        <div id="analysis-results" class="table-wrap">
                            <!-- Results here -->
                        </div>
                    </div>

                    <!-- TAB CONTENT: HISTORICA -->
                    <div id="analysis-tab-historica" class="hidden p-4">
                        <div class="chart-container">
                            <canvas id="history-chart"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../assets/js/core/config.js"></script>
    <script defer src="../../assets/js/core/supabase-client.js"></script>
    <script defer src="../../assets/js/core/auth.js"></script>
    <script defer src="../../assets/js/core/navigation.js"></script>
    <!-- Analysis Modules -->
    <script defer src="../../assets/js/modules/operativo/operativo-analisis.js"></script>


</body>

</html>
